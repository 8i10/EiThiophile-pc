<style>
  :root{
    --accent:#8b0000; --accent-dark:#6b0000; --accent-dim:rgba(139,0,0,0.08);
    --ink:#222222; --muted:#777777; --faint:#999999;
    --line:#e2e2e2; --line2:#d0d0d0;
    --bg:#f5f5f5; --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:0 0 60px;background:var(--bg);color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    line-height:1.6;-webkit-text-size-adjust:100%}
  .wrap{max-width:940px;margin:0 auto;padding:20px 14px 0}

  /* 検索 */
  .search-wrap{position:relative;max-width:340px;margin:0 auto 16px}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px}
  .search-input{width:100%;background:#fff;border:1px solid var(--line2);border-radius:8px;color:var(--ink);
    padding:8px 12px 8px 32px;font-family:inherit;font-size:13px;outline:none}
  .search-input:focus{border-color:var(--accent)}

  /* フィルター */
  .controls{margin-bottom:16px}
  .filter-group{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .filter-btn{background:#fff;border:1px solid var(--line2);border-radius:999px;color:var(--muted);
    padding:5px 13px;font-family:inherit;font-size:12px;cursor:pointer;transition:all .15s}
  .filter-btn:hover{background:#f3f3f3;color:var(--ink)}
  .filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent-dark);font-weight:700}

  /* グリッド */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  @media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;
    transition:transform .2s,box-shadow .2s;opacity:0;animation:fadeUp .5s ease forwards}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.10)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .card-portrait{width:100%;height:200px;background:#eee;overflow:hidden;position:relative}
  .card-portrait img{width:100%;height:100%;object-fit:cover}
  .card-portrait-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#f0e9e9}
  .placeholder-monogram{font-size:3.5rem;font-weight:300;color:#d4b8b8}
  .card-status-badge{position:absolute;top:10px;right:10px;padding:2px 9px;font-size:11px;font-weight:700;border-radius:5px;letter-spacing:.04em}
  .status-生存,.status-生還{background:#eef6ee;color:#3a7d3a;border:1px solid #d6ead6}
  .status-死亡{background:#fdeeee;color:#b23b3b;border:1px solid #f2d4d4}
  .status-不明{background:#fbf6e9;color:#94781f;border:1px solid #eadfc2}
  .status-引退{background:#eef2f7;color:#4a6484;border:1px solid #d8e1ec}
  .card-body{padding:11px 13px 13px}
  .card-furigana{font-size:10px;color:var(--muted);letter-spacing:.08em;margin-bottom:2px}
  .card-name{font-size:15px;font-weight:700;letter-spacing:.02em;margin-bottom:6px}
  .card-meta{display:flex;gap:10px;font-size:11px;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:6px;flex-wrap:wrap}
  .card-quote{font-size:11px;color:var(--muted);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* フッター */
  footer{text-align:center;margin-top:32px}
  .footer-link{font-size:12px;color:var(--accent-dark);text-decoration:none;letter-spacing:.05em;border:1px solid var(--line2);border-radius:8px;padding:7px 18px;transition:all .15s;display:inline-block}
  .footer-link:hover{background:var(--accent);color:#fff;border-color:var(--accent-dark)}

  /* モーダル */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;opacity:0;pointer-events:none;transition:opacity .2s;overflow-y:auto}
  .modal-overlay.open{opacity:1;pointer-events:all}
  .modal{background:var(--card);border-radius:14px;max-width:720px;width:100%;overflow:hidden;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.3);transform:translateY(12px);transition:transform .2s}
  .modal-overlay.open .modal{transform:translateY(0)}
  .modal-close{position:absolute;top:12px;right:14px;background:rgba(0,0,0,.5);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;z-index:10}
  .modal-top{display:grid;grid-template-columns:260px 1fr}
  @media(max-width:560px){.modal-top{grid-template-columns:1fr}}
  .modal-portrait{background:#eee;min-height:300px;overflow:hidden}
  .modal-portrait img{width:100%;height:100%;object-fit:cover;min-height:300px}
  .modal-portrait-placeholder{width:100%;height:100%;min-height:300px;display:flex;align-items:center;justify-content:center;background:#f0e9e9}
  .modal-info{padding:22px 22px 6px}
  .modal-furigana{font-size:11px;color:var(--muted);letter-spacing:.15em;margin-bottom:3px}
  .modal-name{font-size:22px;font-weight:700;letter-spacing:.03em;margin-bottom:12px}
  .modal-meta-row{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:9px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .modal-meta-row span strong{color:var(--ink);display:block;font-weight:700;font-size:14px}
  .modal-stats-inline{margin-top:12px}
  .modal-stats-inline .stats-block-label{font-size:11px;color:var(--muted);letter-spacing:.1em;margin:8px 0 4px}
  .modal-stats-inline .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .stat-item{background:#f7f7f7;border:1px solid var(--line);border-radius:6px;padding:6px 3px;text-align:center}
  .stat-label{font-size:10px;color:var(--muted);letter-spacing:.06em}
  .stat-val{font-size:16px;font-weight:700;color:var(--accent-dark)}
  .modal-body{padding:6px 22px 24px}
  .modal-section-title{font-size:13px;font-weight:700;color:var(--accent-dark);letter-spacing:.06em;margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .modal-profile{font-size:13px;line-height:1.9;color:var(--ink);white-space:pre-wrap}
  .traits-table{width:100%;border-collapse:collapse;font-size:12px}
  .traits-table th{background:var(--accent-dim);color:var(--accent-dark);font-weight:700;letter-spacing:.04em;padding:6px 8px;border:1px solid var(--line);text-align:left}
  .traits-table td{padding:6px 8px;border:1px solid var(--line)}
  .traits-table tr:nth-child(even) td{background:#faf9f9}
  .accordion{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .accordion-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;background:#fafafa}
  .accordion-header:hover{background:#f2f2f2}
  .accordion-title{font-size:13px;font-weight:700;color:var(--accent-dark);letter-spacing:.06em}
  .accordion-count{font-size:11px;color:var(--muted);margin-left:8px}
  .accordion-arrow{font-size:10px;color:var(--accent);transition:transform .2s}
  .accordion.open .accordion-arrow{transform:rotate(180deg)}
  .accordion-body{display:none;padding:6px 14px 12px}
  .accordion.open .accordion-body{display:block}
  .session-list{list-style:none;margin:0;padding:0}
  .session-list li{position:relative;padding:4px 0 4px 16px;font-size:12px;color:var(--ink);border-bottom:1px dashed var(--line)}
  .session-list li:last-child{border-bottom:none}
  .session-list li::before{content:'—';position:absolute;left:0;color:var(--accent)}
  .page-title{text-align:center;font-size:17px;font-weight:700;letter-spacing:.1em;margin:6px 0 16px;color:var(--ink)}
</style>
<style>
/* ===== 共通ヘッダー（EITHIOPHILE） ===== */
.eth-fix{position:sticky;top:0;z-index:1200}
header.eth{background:#8b0000}
.eth-inner{max-width:900px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.eth-title{font-size:17px;font-weight:800;color:#ffffff;letter-spacing:.30em;font-family:Arial,Helvetica,sans-serif}
.eth-navwrap{position:relative}
.eth-navbtn{background:transparent;border:1px solid rgba(255,255,255,.6);border-radius:6px;padding:4px 11px;font-size:16px;line-height:1.2;cursor:pointer;color:#fff;font-family:inherit}
.eth-navbtn:hover{background:rgba(255,255,255,.15)}
.eth-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:1300;background:#ffffff;border:1px solid #d4d4d4;border-radius:8px;min-width:200px;max-height:70vh;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:6px}
.eth-menu.open{display:block}
.eth-mtab{display:block;width:100%;text-align:left;background:transparent;border:none;color:#222;padding:9px 12px;font-size:14px;cursor:pointer;white-space:nowrap;font-family:inherit;border-radius:6px}
.eth-mtab:hover{background:#ececec}
.eth-mtab.active{background:#8b0000;color:#fff;font-weight:700}
.eth-tabbar{background:#ffffff;border-bottom:1px solid #d4d4d4;overflow-x:auto;-webkit-overflow-scrolling:touch}
.eth-tabbar-inner{max-width:900px;margin:0 auto;display:flex}
.eth-tab{background:transparent;border:none;border-bottom:2px solid transparent;color:#777;padding:8px 16px;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit}
.eth-tab:hover{color:#222}
.eth-tab.active{color:#222;font-weight:700;border-bottom-color:#8b0000}
</style>
</head>
<body>

<div class="eth-fix">
  <header class="eth">
    <div class="eth-inner">
      <div class="eth-title">EITHIOPHILE</div>
      <div class="eth-navwrap">
        <button class="eth-navbtn" id="ethNavBtn" aria-label="メニュー">≡</button>
        <div class="eth-menu" id="ethNavMenu"></div>
      </div>
    </div>
  </header>
  <nav class="eth-tabbar" id="ethTabbar" style="display:none"><div class="eth-tabbar-inner" id="ethTabbarInner"></div></nav>
</div>

<div class="wrap">
  <div class="page-title">探索者一覧</div>

  <div class="search-wrap">
    <span class="search-icon">&#128269;</span>
    <input class="search-input" id="searchInput" type="text" placeholder="PC名・ふりがな・通過シナリオで検索…" oninput="renderGrid()">
  </div>

  <div class="controls" id="controls"></div>
  <div class="grid" id="grid"></div>

  <footer>
    <a href="login.html" class="footer-link">&#9998; 編集ページへ</a>
  </footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-top">
      <div class="modal-portrait" id="modalPortrait"></div>
      <div class="modal-info">
        <div class="modal-furigana" id="modalFurigana"></div>
        <div class="modal-name" id="modalName"></div>
        <div class="modal-meta-row" id="modalMeta"></div>
        <!-- ステータス：メタ情報の直下 -->
        <div class="modal-stats-inline" id="modalStatsInline"></div>
      </div>
    </div>
    <div class="modal-body">
      <!-- プロフィール -->
      <div class="modal-section-title">プロフィール</div>
      <div class="modal-profile" id="modalProfile"></div>
      <!-- 特徴表 -->
      <div id="modalTraitsWrap"></div>
      <!-- 通過シナリオ -->
      <div id="modalSessionsWrap" style="margin-top:1.5rem"></div>
    </div>
  </div>
</div>

<script>

let characters = [];
let activeFilter = 'all';
let activeCat = 'all';

function fixDropboxUrl(url) {
  if (!url) return url;
  if (url.includes('dropbox.com')) {
    return url.replace('www.dropbox.com','dl.dropboxusercontent.com')
              .replace(/[?&]dl=\d/,'').replace(/[?&]raw=\d/,'');
  }
  return url;
}

async function loadCharacters() {
  try {
    const res = await fetch('characters.json?t=' + Date.now());
    characters = await res.json();
  } catch { characters = []; }
  // ふりがなで五十音順ソート（カタカナ→ひらがな正規化）
  characters.sort((a, b) => {
    const toHira = s => (s || '').replace(/[\u30A1-\u30F6]/g, c =>
      String.fromCharCode(c.charCodeAt(0) - 0x60));
    return toHira(a.furigana).localeCompare(toHira(b.furigana), 'ja');
  });
  renderFilters();
  renderGrid();
}

const CATEGORY_ORDER = [
  '無所属(現代日本)','無所属(現代海外)','無所属(時代違いetc)',
  '施設組','教会組','喫茶店組','考古学研究所組',
  '凪・薙一族','四季組','四神組',
  '極道「天神会」','中華マフィア「煌」','中華マフィア「蓮」'
];

function renderFilters() {
  const ctrl = document.getElementById('controls');
  const used = new Set(characters.map(c => c.category).filter(Boolean));
  // 定義順に並べ、定義外のカテゴリーは末尾に追加
  const ordered = CATEGORY_ORDER.filter(c => used.has(c));
  const extra = [...used].filter(c => !CATEGORY_ORDER.includes(c));
  const cats = ['all', ...ordered, ...extra];
  const catBtns = cats.map(s =>
    `<button class="filter-btn ${s===activeCat?'active':''}" onclick="setCat('${s.replace(/'/g,"\\'")}')">
      ${s==='all'?'すべて':s}</button>`).join('');
  ctrl.innerHTML = `<div class="filter-group">${catBtns}</div>`;
}

function setFilter(f) { activeFilter = activeFilter===f?'all':f; renderFilters(); renderGrid(); }
function setCat(c)    { activeCat = c; renderFilters(); renderGrid(); }

function toHira(s) {
  return (s || '').replace(/[\u30A1-\u30F6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}

function renderGrid() {
  const q = (document.getElementById('searchInput')?.value||'').trim().toLowerCase();
  let filtered = characters;
  if (activeCat !== 'all') filtered = filtered.filter(c => c.category === activeCat);
  if (q) filtered = filtered.filter(c =>
    (c.name||'').toLowerCase().includes(q) ||
    (c.furigana||'').toLowerCase().includes(q) ||
    (c.sessions||[]).some(s => s.toLowerCase().includes(q))
  );
  // 五十音順ソート（ひらがな・カタカナ混合対応）
  filtered = [...filtered].sort((a, b) =>
    toHira(a.furigana).localeCompare(toHira(b.furigana), 'ja')
  );

  document.getElementById('grid').innerHTML = filtered.map((c, i) => {
    const cardLine = (c.sessions&&c.sessions[0]) || '';
    const pos = c.imagePos || '50% 20%';
    const [ox, oy] = pos.split(' ');
    const sc = c.imageScale || 1.0;
    return `
    <div class="card" style="animation-delay:${i*0.07}s" onclick="openModal('${c.id}')">
      <div class="card-portrait" style="background:linear-gradient(160deg,${c.color||'#7c9bb5'}22,#1a1a1f)">
        ${c.image
          ?`<img src="${fixDropboxUrl(c.image)}" alt="${c.name}" loading="lazy" style="object-position:${pos};--img-ox:${ox};--img-oy:${oy};--img-scale:${sc};transform:scale(${sc});transform-origin:${ox} ${oy}">`
          :`<div class="card-portrait-placeholder"><span class="placeholder-monogram">${c.name?c.name.charAt(0):'?'}</span></div>`}
        ${c.status?`<span class="card-status-badge status-${c.status}">${c.status}</span>`:''}
      </div>
      <div class="card-body">
        ${c.furigana?`<div class="card-furigana">${c.furigana}</div>`:''}
        <div class="card-name">${c.name||'（名前なし）'}</div>
        <div class="card-meta">
          ${c.age?`<span>${c.age}歳</span>`:''}
          ${c.occupation?`<span>${c.occupation}</span>`:''}
        </div>
        ${cardLine?`<div class="card-quote">${cardLine}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function openModal(id) {
  const c = characters.find(x => x.id === id);
  if (!c) return;

  document.getElementById('modalFurigana').textContent = c.furigana || '';
  document.getElementById('modalName').textContent = c.name || '';
  document.getElementById('modalProfile').textContent = c.profile || '';

  document.getElementById('modalMeta').innerHTML = `
    ${c.age?`<span>年齢<strong>${c.age}歳</strong></span>`:''}
    ${c.occupation?`<span>職業<strong>${c.occupation}</strong></span>`:''}
    <span>誕生日<strong>${c.birthday||'未設定'}</strong></span>
    ${c.status?`<span>状態<strong>${c.status}</strong></span>`:''}`;

  const pos = c.imagePos || '50% 20%';
  const [ox, oy] = pos.split(' ');
  const sc = c.imageScale || 1.0;
  document.getElementById('modalPortrait').innerHTML = c.image
    ? `<img src="${fixDropboxUrl(c.image)}" alt="${c.name}" style="object-position:${pos};transform:scale(${sc});transform-origin:${ox} ${oy}">`
    : `<div class="modal-portrait-placeholder"><span class="placeholder-monogram" style="font-size:5rem;opacity:0.15">${c.name?c.name.charAt(0):'?'}</span></div>`;

  // ステータス（右パネル内）
  const statsInline = document.getElementById('modalStatsInline');
  const primary   = ['STR','CON','POW','DEX','APP','SIZ','INT','EDU'];
  const hasAny = keys => c.stats && keys.some(k => c.stats[k]!==''&&c.stats[k]!=null);
  if (c.stats && Object.keys(c.stats).some(k=>c.stats[k]!==''&&c.stats[k]!=null)) {
    let html='';
    if (hasAny(primary)) {
      html+=`<div class="stats-block-label">基本能力値</div><div class="stats-row">`+
        primary.filter(k=>c.stats[k]!==''&&c.stats[k]!=null).map(k=>
          `<div class="stat-item"><div class="stat-label">${k}</div><div class="stat-val">${c.stats[k]}</div></div>`
        ).join('')+`</div>`;
    }
    if (c.stats['DB']!==''&&c.stats['DB']!=null)
      html+=`<div class="stats-row" style="margin-top:0.3rem"><div class="stat-item"><div class="stat-label">DB</div><div class="stat-val" style="font-size:0.9rem">${c.stats['DB']}</div></div></div>`;
    statsInline.innerHTML = html;
  } else {
    statsInline.innerHTML = '';
  }

  // 特徴表
  const traitsWrap = document.getElementById('modalTraitsWrap');
  if (c.traits && c.traits.length) {
    traitsWrap.innerHTML = `
      <div class="modal-section-title">特徴表</div>
      <table class="traits-table">
        <thead><tr><th>ダイス</th><th>特徴</th></tr></thead>
        <tbody>${c.traits.map(t=>`<tr><td>${t.dice||''}</td><td>${t.text||''}</td></tr>`).join('')}</tbody>
      </table>`;
  } else {
    traitsWrap.innerHTML = '';
  }

  // 通過シナリオ アコーディオン
  const sessWrap = document.getElementById('modalSessionsWrap');
  if (c.sessions && c.sessions.length) {
    sessWrap.innerHTML = `
      <div class="accordion" id="sessAccordion">
        <div class="accordion-header" onclick="toggleAccordion()">
          <span><span class="accordion-title">通過シナリオ</span><span class="accordion-count">${c.sessions.length}件</span></span>
          <span class="accordion-arrow">▼</span>
        </div>
        <div class="accordion-body">
          <ul class="session-list">${c.sessions.map(s=>`<li>${s}</li>`).join('')}</ul>
        </div>
      </div>`;
  } else {
    sessWrap.innerHTML = '';
  }

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function toggleAccordion() {
  document.getElementById('sessAccordion')?.classList.toggle('open');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

loadCharacters();

</script>

<script>
(function(){
  var REPO   = "8i10/kp-scenario";
  var BRANCH = "main";
  var JSON_URL = "https://raw.githubusercontent.com/"+REPO+"/"+BRANCH+"/profile.json";
  var HOME = "index.html";
  var EDIT = new URLSearchParams(location.search).get("edit") === "1";
  var SELF = (location.pathname.split("/").pop() || "index.html").toLowerCase();

  function withEdit(u){
    if(!EDIT) return u;
    return u + (u.indexOf("?") >= 0 ? "&" : "?") + "edit=1";
  }
  function fileOf(u){ return String(u||"").split("?")[0].split("/").pop().toLowerCase(); }
  function isSelf(u){ return !!u && fileOf(u) === SELF; }

  var menu = document.getElementById("ethNavMenu");
  var btn  = document.getElementById("ethNavBtn");
  function closeMenu(){ menu.classList.remove("open"); }
  btn.addEventListener("click", function(e){ e.stopPropagation(); menu.classList.toggle("open"); });
  document.addEventListener("click", function(e){
    var w = document.querySelector(".eth-navwrap");
    if(w && !w.contains(e.target)) closeMenu();
  });

  function majorHref(m){
    if(m.url) return withEdit(m.url);
    var ps = m.pages || [];
    if(ps.length && ps.every(function(p){ return !!p.url; })) return withEdit(ps[0].url);
    return withEdit(HOME + "?major=" + encodeURIComponent(m.id || ""));
  }
  function pageHref(m, p){
    if(p.url) return withEdit(p.url);
    return withEdit(HOME + "?major=" + encodeURIComponent(m.id || "") + "&page=" + encodeURIComponent(p.id || ""));
  }

  fetch(JSON_URL + "?t=" + Date.now())
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      var majors = (j && Array.isArray(j.majors)) ? j.majors : [];
      var cur = null;
      majors.forEach(function(m){
        if(isSelf(m.url)) cur = m;
        (m.pages || []).forEach(function(p){ if(isSelf(p.url)) cur = m; });
      });

      menu.innerHTML = "";
      majors.forEach(function(m){
        var b = document.createElement("button");
        var here = (cur && m.id === cur.id);
        b.className = "eth-mtab" + (here ? " active" : "");
        b.textContent = m.name || "(無題)";
        b.addEventListener("click", function(){ closeMenu(); location.href = majorHref(m); });
        menu.appendChild(b);
      });

      var bar = document.getElementById("ethTabbar");
      var inner = document.getElementById("ethTabbarInner");
      inner.innerHTML = "";
      if(cur && (cur.pages || []).length > 1){
        bar.style.display = "";
        cur.pages.forEach(function(p){
          var b = document.createElement("button");
          b.className = "eth-tab" + (isSelf(p.url) ? " active" : "");
          b.textContent = p.name || "(無題)";
          b.addEventListener("click", function(){ location.href = pageHref(cur, p); });
          inner.appendChild(b);
        });
      }
    })
    .catch(function(){ /* 取得失敗時はメニュー空 */ });
})();
</script>
