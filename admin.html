<script>
// 認証チェック（ページ描画前に実行）
(async function(){
  const stored = sessionStorage.getItem('admin_auth');
  if (!stored) { location.replace('login.html'); return; }
  async function sha256(s){
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  const PASS_HASH='a0b3e52b487b26ce296364eac9aca2b13668ebc9b3920ceac8de1e634a25c663';
  const expected = btoa('cracktrackxxxx@gmail.com:'+PASS_HASH.slice(0,16));
  if (stored !== expected) { sessionStorage.removeItem('admin_auth'); location.replace('login.html'); }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>探索者編集 — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e10;
    --surface: #16161a;
    --surface2: #1e1e23;
    --border: #2a2a30;
    --text: #e8e6e0;
    --muted: #8a887e;
    --accent: #c9a96e;
    --accent-dim: rgba(201,169,110,0.12);
    --danger: #c47070;
    --success: #70c490;
    --header-h: 56px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Noto Serif JP', serif;
    min-height: 100vh;
  }

  /* ── Layout ── */
  .admin-layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 700px) {
    .admin-layout { grid-template-columns: 1fr; }
    .sidebar { position: static; border-right: none; border-bottom: 1px solid var(--border); height: auto; }
  }

  /* ── Sidebar ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 2rem 1.25rem;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .sidebar-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--accent);
    letter-spacing: 0.2em;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .char-list { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; }

  .char-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.6rem 0.75rem;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
    font-size: 0.82rem;
  }
  .char-item:hover { border-color: var(--border); background: var(--surface2); }
  .char-item.active { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }

  .char-avatar {
    width: 32px; height: 32px;
    background: var(--bg);
    border: 1px solid var(--border);
    overflow: hidden;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    color: var(--muted);
  }
  .char-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top; }

  .char-item-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .char-delete-btn {
    background: none; border: none; color: var(--border);
    cursor: pointer; font-size: 0.8rem; padding: 0.1rem 0.3rem;
    transition: color 0.15s; flex-shrink: 0;
  }
  .char-delete-btn:hover { color: var(--danger); }

  .btn-new {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 0.6rem;
    font-family: 'Noto Serif JP', serif;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.15s;
    width: 100%;
  }
  .btn-new:hover { background: rgba(201,169,110,0.2); }

  /* ── Main wrapper ── */
  .main-wrapper {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100vh;
  }
  @media (max-width: 700px) { .main-wrapper { height: auto; } }

  /* ── Sticky top header bar ── */
  .edit-header {
    position: sticky;
    top: 0;
    z-index: 50;
    height: var(--header-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
    gap: 1rem;
    flex-shrink: 0;
  }
  .edit-header-left { display: flex; flex-direction: column; gap: 0.1rem; overflow: hidden; }
  .edit-header-name {
    font-size: 1.1rem;
    font-weight: 200;
    letter-spacing: 0.12em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .edit-header-id { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em; }
  .edit-header-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }

  /* ── Scrollable form area ── */
  .main-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 2rem;
  }

  /* ── Empty state ── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%;
    padding: 6rem 2rem; color: var(--muted); text-align: center; gap: 1rem;
  }
  .empty-icon { font-size: 2.5rem; opacity: 0.3; }

  /* ── Form ── */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem 1.5rem;
  }
  @media (max-width: 550px) { .form-grid { grid-template-columns: 1fr; } }

  .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
  .form-group.full { grid-column: 1 / -1; }

  label {
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  input, textarea, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.5rem 0.75rem;
    font-family: 'Noto Serif JP', serif;
    font-size: 0.82rem;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 80px; line-height: 1.8; }
  input[type="color"] { padding: 0.2rem; height: 2.2rem; cursor: pointer; }

  .section-divider {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.2em;
    padding: 1.5rem 0 0.75rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1rem;
    grid-column: 1 / -1;
  }

  /* Portrait */
  .portrait-section {
    grid-column: 1 / -1;
    display: flex;
    gap: 1.5rem;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .portrait-preview {
    width: 120px; height: 160px;
    background: var(--surface2);
    border: 1px solid var(--border);
    overflow: hidden;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .portrait-placeholder-text { font-size: 0.65rem; color: var(--muted); text-align: center; padding: 0.5rem; }
  .portrait-inputs { flex: 1; display: flex; flex-direction: column; gap: 0.75rem; min-width: 200px; }

  /* ドラッグクロップ */
  .crop-wrap {
    position: relative;
    width: 240px; height: 240px;
    background: var(--surface2);
    border: 1px solid var(--border);
    overflow: hidden;
    flex-shrink: 0;
    cursor: grab;
    user-select: none;
    touch-action: none;
    -webkit-user-select: none;
  }
  .crop-wrap.dragging { cursor: grabbing; }
  .crop-wrap img {
    position: absolute;
    /* サイズ・位置はJSのtranslate方式で制御 */
    pointer-events: none;
    user-select: none;
    will-change: transform;
    /* object-fitは使わずtransformで動かす */
  }
  .crop-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none;
    padding-bottom: 0.5rem;
    background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 50%);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .crop-wrap:hover .crop-hint { opacity: 1; }
  .crop-hint-text {
    font-size: 0.6rem;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.08em;
    text-align: center;
    line-height: 1.8;
  }
  .crop-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
    grid-column: 1 / -1;
  }
  .stats-grid-6 {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 0.5rem;
    grid-column: 1 / -1;
  }
  .stats-grid-db {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
    grid-column: 1 / -1;
  }
  @media (max-width: 500px) {
    .stats-grid, .stats-grid-6, .stats-grid-db { grid-template-columns: repeat(2,1fr); }
  }

  .stat-input-group { display: flex; flex-direction: column; gap: 0.3rem; }
  .stat-input-group label { text-align: center; }
  .stat-input-group input { text-align: center; }

  /* Tags */
  .tags-input-wrap { display: flex; flex-direction: column; gap: 0.5rem; }
  .tags-display { display: flex; flex-wrap: wrap; gap: 0.4rem; min-height: 2rem; }
  .tag-chip {
    background: var(--accent-dim);
    border: 1px solid rgba(201,169,110,0.25);
    color: var(--accent);
    font-size: 0.68rem;
    padding: 0.15rem 0.5rem;
    display: flex; align-items: center; gap: 0.3rem;
  }
  .tag-chip button { background: none; border: none; color: inherit; cursor: pointer; font-size: 0.7rem; padding: 0; line-height: 1; }
  .tag-add-row { display: flex; gap: 0.4rem; }
  .tag-add-row input { flex: 1; }
  .tag-add-btn {
    background: var(--accent-dim); border: 1px solid var(--accent);
    color: var(--accent); padding: 0.4rem 0.75rem;
    cursor: pointer; font-size: 0.75rem; white-space: nowrap;
    font-family: 'Noto Serif JP', serif;
  }

  /* Buttons */
  .btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.45rem 1.1rem;
    font-family: 'Noto Serif JP', serif;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .btn.primary:hover { background: rgba(201,169,110,0.22); }
  .btn.danger { border-color: rgba(196,112,112,0.4); color: var(--danger); }
  .btn.danger:hover { border-color: var(--danger); background: rgba(196,112,112,0.1); }

  /* Delete zone */
  .delete-zone {
    grid-column: 1 / -1;
    margin-top: 1rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .delete-zone-label {
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  /* Notice */
  .notice {
    background: var(--accent-dim);
    border: 1px solid rgba(201,169,110,0.25);
    padding: 0.75rem 1rem;
    font-size: 0.75rem;
    color: var(--muted);
    line-height: 1.8;
  }
  .notice strong { color: var(--accent); }
  .notice code { background: rgba(255,255,255,0.05); padding: 0.1rem 0.3rem; font-size: 0.72rem; }

  /* JSON area */
  .json-area {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: monospace;
    font-size: 0.72rem;
    padding: 1rem;
    width: 100%;
    min-height: 160px;
    resize: vertical;
    margin-top: 1rem;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 2rem; right: 2rem;
    background: var(--surface);
    border: 1px solid var(--success);
    color: var(--success);
    padding: 0.75rem 1.5rem;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
    z-index: 999;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  /* GitHub設定モーダル */
  .gh-modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
    backdrop-filter: blur(4px);
  }
  .gh-modal-overlay.open { opacity: 1; pointer-events: all; }
  .gh-modal {
    background: var(--surface);
    border: 1px solid var(--border);
    width: 100%; max-width: 480px;
    padding: 2rem;
    position: relative;
  }
  .gh-modal-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--accent);
    letter-spacing: 0.15em;
    margin-bottom: 1.5rem;
  }
  .gh-modal-close {
    position: absolute; top: 1rem; right: 1rem;
    background: none; border: 1px solid var(--border);
    color: var(--muted); width: 1.8rem; height: 1.8rem;
    cursor: pointer; font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .gh-modal-close:hover { border-color: var(--accent); color: var(--accent); }
  .gh-field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
  .gh-field label { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
  .gh-status {
    margin-top: 0.75rem;
    font-size: 0.72rem;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--border);
    color: var(--muted);
    display: none;
  }
  .gh-status.ok  { border-color: rgba(112,196,144,0.5); color: var(--success); display: block; }
  .gh-status.err { border-color: rgba(196,112,112,0.5); color: var(--danger);  display: block; }

  /* GitHubに反映ボタン（ヘッダー内） */
  .btn-push {
    background: rgba(100,160,100,0.1);
    border: 1px solid rgba(100,160,100,0.5);
    color: #7cc47c;
    padding: 0.45rem 1.1rem;
    font-family: 'Noto Serif JP', serif;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-push:hover { background: rgba(100,160,100,0.2); border-color: #7cc47c; }
  .btn-push:disabled { opacity: 0.4; cursor: not-allowed; }
</style>

<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-title">✦ 探索者編集</div>
    <div class="char-list" id="charList"></div>
    <button class="btn-new" onclick="createNew()">＋ 新しい探索者を追加</button>
    <button class="btn-new" style="background:rgba(100,160,200,0.1);border-color:#6ab0d4;color:#6ab0d4;margin-top:0.25rem" onclick="document.getElementById('importFileInput').click()">
      📥 キャラシJSONをインポート（複数可）
    </button>
    <input type="file" id="importFileInput" accept=".json" multiple style="display:none" onchange="handleImportFile(this)">
    <button class="btn" style="width:100%;margin-top:0.5rem;border-color:rgba(201,169,110,0.4);color:var(--accent)" onclick="openGhSettings()">
      ⚙ GitHub設定
    </button>
    <a href="index.html" style="text-decoration:none">
      <button class="btn" style="width:100%;margin-top:0.25rem">← 一覧ページへ戻る</button>
    </a>
  </aside>

  <!-- GitHub設定モーダル -->
  <div class="gh-modal-overlay" id="ghModalOverlay">
    <div class="gh-modal">
      <button class="gh-modal-close" onclick="closeGhSettings()">✕</button>
      <div class="gh-modal-title">⚙ GitHub 設定</div>
      <div class="gh-field">
        <label>リポジトリ（owner/repo）</label>
        <input id="gh-repo" placeholder="例: 8i10/EiThiophile-pc">
      </div>
      <div class="gh-field">
        <label>ブランチ</label>
        <input id="gh-branch" placeholder="main">
      </div>
      <div class="gh-field">
        <label>characters.jsonのパス</label>
        <input id="gh-path" placeholder="characters.json">
      </div>
      <div class="gh-field">
        <label>Personal Access Token（Fine-grained推奨）</label>
        <input id="gh-token" type="password" placeholder="github_pat_…">
      </div>
      <div style="font-size:0.7rem;color:var(--muted);line-height:1.8;margin-bottom:1rem">
        トークンは <strong style="color:var(--accent)">このブラウザのローカルストレージにのみ</strong> 保存されます。<br>
        GitHubには送信されません（GitHub API経由のみ使用）。<br>
        Fine-grained Token → Contents: Read &amp; Write 権限が必要です。
      </div>
      <div style="display:flex;gap:0.5rem">
        <button class="btn primary" onclick="saveGhSettings()">保存</button>
        <button class="btn" onclick="testGhConnection()">接続テスト</button>
      </div>
      <div class="gh-status" id="ghStatus"></div>

  <!-- Main -->
  <div class="main-wrapper">

    <!-- Sticky header (shown when a character is selected) -->

      <div class="edit-header-left">

        <div class="edit-header-id" id="editHeaderId"></div>
      </div>
      <div class="edit-header-actions">
        <button class="btn primary" onclick="saveAndPush()">保存</button>
      </div>
    </div>

    <!-- Scrollable form area -->
    <div id="mainArea" class="main-scroll">
      <div class="empty-state">
        <div class="empty-icon">✦</div>
        <div>左のリストから探索者を選ぶか、<br>新しく追加してください</div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast">保存しました</div>

<script>
let characters = [];

// カテゴリー一覧（画像の並び順）
const CATEGORIES = [
  '無所属(現代日本)','無所属(現代海外)','無所属(時代違いetc)',
  '施設組','教会組','喫茶店組','考古学研究所組',
  '凪・薙一族','四季組','四神組',
  '極道「天神会」','中華マフィア「煌」','中華マフィア「蓮」'
];
let currentId = null;
let sessions = [];

// ── GitHub設定 ──
const GH_KEY = 'trpg_gh_settings';

function loadGhSettings() {
  try { return JSON.parse(localStorage.getItem(GH_KEY)) || {}; } catch { return {}; }
}
function saveGhSettingsToStorage(s) {
  localStorage.setItem(GH_KEY, JSON.stringify(s));
}

function openGhSettings() {
  const s = loadGhSettings();
  document.getElementById('gh-repo').value   = s.repo   || '';
  document.getElementById('gh-branch').value = s.branch || 'main';
  document.getElementById('gh-path').value   = s.path   || 'characters.json';
  document.getElementById('gh-token').value  = s.token  || '';
  document.getElementById('ghStatus').className = 'gh-status';
  document.getElementById('ghModalOverlay').classList.add('open');
}
function closeGhSettings() {
  document.getElementById('ghModalOverlay').classList.remove('open');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeGhSettings();
});

function saveGhSettings() {
  const s = {
    repo:   document.getElementById('gh-repo').value.trim(),
    branch: document.getElementById('gh-branch').value.trim() || 'main',
    path:   document.getElementById('gh-path').value.trim() || 'characters.json',
    token:  document.getElementById('gh-token').value.trim(),
  };
  saveGhSettingsToStorage(s);
  closeGhSettings();
  updateGhNotice();
  showToast('GitHub設定を保存しました ✓');
}

async function testGhConnection() {
  const s = loadGhSettings();
  const statusEl = document.getElementById('ghStatus');
  if (!s.repo || !s.token) {
    statusEl.className = 'gh-status err';
    statusEl.textContent = 'リポジトリとトークンを入力してください';
    return;
  }
  statusEl.className = 'gh-status';
  statusEl.textContent = '接続中…';
  statusEl.style.display = 'block';
  try {
    const res = await fetch(`https://api.github.com/repos/${s.repo}`, {
      headers: { Authorization: `Bearer ${s.token}`, 'X-GitHub-Api-Version': '2022-11-28' }
    });
    if (res.ok) {
      const data = await res.json();
      statusEl.className = 'gh-status ok';
      statusEl.textContent = `✓ 接続成功：${data.full_name}`;
    } else {
      const err = await res.json();
      statusEl.className = 'gh-status err';
      statusEl.textContent = `✗ エラー ${res.status}: ${err.message}`;
    }
  } catch (e) {
    statusEl.className = 'gh-status err';
    statusEl.textContent = '✗ 通信エラー: ' + e.message;
  }
}

function updateGhNotice() {
  const s = loadGhSettings();
  const el = document.getElementById('ghNoticeText');
  if (!el) return;
  if (s.repo && s.token) {
    el.innerHTML = `✓ 接続先: <strong style="color:var(--accent)">${s.repo}</strong> / ${s.path} &nbsp;—&nbsp; 「保存」で自動反映されます`;
  } else {
    el.textContent = '⚙ まず「GitHub設定」でリポジトリとトークンを設定してください。設定済みの場合、「保存」ボタンで自動的にGitHubへ反映されます。';
  }
}

// ── GitHub API: characters.json を push ──
async function pushToGitHub() {
  const s = loadGhSettings();
  if (!s.repo || !s.token) return; // 設定なしは黙って無視（手動コピーで対応）

  const btn = document.querySelector('.edit-header-actions .btn.primary');
  if (btn) { btn.disabled = true; btn.textContent = '反映中…'; }

  try {
    const json = JSON.stringify(characters, null, 2);
    const base64 = btoa(unescape(encodeURIComponent(json)));
    const apiUrl = `https://api.github.com/repos/${s.repo}/contents/${s.path}`;
    const headers = {
      'Authorization': `Bearer ${s.token}`,
      'Content-Type': 'application/json',
      'X-GitHub-Api-Version': '2022-11-28',
    };

    // 毎回最新のSHAを取得（timestamp付きでキャッシュ回避）
    let sha = '';
    const getRes = await fetch(apiUrl + `?ref=${s.branch}&t=${Date.now()}`, { headers });
    if (getRes.ok) {
      const data = await getRes.json();
      sha = data.sha;
    } else if (getRes.status !== 404) {
      const err = await getRes.json();
      throw new Error(`取得エラー ${getRes.status}: ${err.message}`);
    }

    // PUT でファイルを更新 or 新規作成
    const body = {
      message: `Update characters.json [admin]`,
      content: base64,
      branch:  s.branch,
    };
    if (sha) body.sha = sha;

    const putRes = await fetch(apiUrl, {
      method: 'PUT',
      headers,
      body: JSON.stringify(body),
    });

    if (putRes.ok) {
      showToast('GitHubに反映しました ✓ (1〜2分で反映)');
    } else {
      const err = await putRes.json();
      throw new Error(`更新エラー ${putRes.status}: ${err.message}`);
    }
  } catch (e) {
    showToast('エラー: ' + e.message, true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '保存'; }
  }
}

// ── Dropbox URL変換 ──
function fixDropboxUrl(url) {
  if (!url) return url;
  if (url.includes('dropbox.com')) {
    return url
      .replace('www.dropbox.com', 'dl.dropboxusercontent.com')
      .replace(/[?&]dl=\d/, '')
      .replace(/[?&]raw=\d/, '');
  }
  return url;
}

  try {
    const res = await fetch('characters.json?t=' + Date.now());
    characters = await res.json();
  } catch { characters = []; }

}

// ── ドラッグクロップ（transform方式 + ズーム対応）──
const _crop = {
  dragging: false,
  startX: 0, startY: 0,
  imgX: 0, imgY: 0,
  baseW: 0, baseH: 0,   // スケール1.0のときのサイズ
  imgW: 0, imgH: 0,     // 現在の表示サイズ
  scale: 1.0,
  wrapW: 240, wrapH: 240,
  pinchDist: 0          // ピンチ距離
};

// ── グローバルイベント（一度だけ登録）──
document.addEventListener('mousemove', e => {
  if (!_crop.dragging) return;
  _cropDragMove(e.clientX, e.clientY);
}, { passive: true });

document.addEventListener('mouseup', () => {
  if (!_crop.dragging) return;
  _crop.dragging = false;
  const w = document.getElementById('cropWrap');
  if (w) w.classList.remove('dragging');
  _cropSavePos();
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!_crop.dragging && _crop.pinchDist === 0) return;
  if (e.touches.length === 2) {
    // ピンチズーム
    e.preventDefault();
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    if (_crop.pinchDist > 0) {
      const ratio = d / _crop.pinchDist;
      _cropSetScale(_crop.scale * ratio);
    }
    _crop.pinchDist = d;
  } else if (e.touches.length === 1 && _crop.dragging) {
    e.preventDefault();
    _cropDragMove(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: false });

document.addEventListener('touchend', e => {
  _crop.pinchDist = 0;
  if (e.touches.length === 0) {
    _crop.dragging = false;
    _cropSavePos();
  }
}, { passive: true });

function _cropClamp() {
  _crop.imgX = Math.max(Math.min(0, _crop.wrapW - _crop.imgW), Math.min(0, _crop.imgX));
  _crop.imgY = Math.max(Math.min(0, _crop.wrapH - _crop.imgH), Math.min(0, _crop.imgY));
}

function _cropApply() {
  const img = document.getElementById('cropImg');
  if (!img) return;
  img.style.width  = _crop.imgW + 'px';
  img.style.height = _crop.imgH + 'px';
  img.style.left   = _crop.imgX + 'px';
  img.style.top    = _crop.imgY + 'px';
}

function _cropDragMove(ex, ey) {
  const dx = ex - _crop.startX;
  const dy = ey - _crop.startY;
  _crop.startX = ex;
  _crop.startY = ey;
  _crop.imgX += dx;
  _crop.imgY += dy;
  _cropClamp();
  _cropApply();
}

function _cropSetScale(s) {
  s = Math.max(0.5, Math.min(6.0, s));
  // スケール変更前の中心点を維持
  const cx = _crop.wrapW / 2;
  const cy = _crop.wrapH / 2;
  const ratio = s / _crop.scale;
  _crop.imgX = cx + (_crop.imgX - cx) * ratio;
  _crop.imgY = cy + (_crop.imgY - cy) * ratio;
  _crop.scale = s;
  _crop.imgW = _crop.baseW * s;
  _crop.imgH = _crop.baseH * s;
  _cropClamp();
  _cropApply();
  // スライダー同期
  const sl = document.getElementById('cropZoomSlider');
  if (sl) sl.value = Math.round(s * 100);
  _cropSavePos();
}

function cropZoomFromSlider(val) {
  _cropSetScale(parseFloat(val) / 100);
}

function _cropSavePos() {
  const ox = _crop.imgW > _crop.wrapW
    ? ((-_crop.imgX) / (_crop.imgW - _crop.wrapW)) * 100 : 50;
  const oy = _crop.imgH > _crop.wrapH
    ? ((-_crop.imgY) / (_crop.imgH - _crop.wrapH)) * 100 : 50;
  const pos = `${Math.round(ox)}% ${Math.round(oy)}%`;
  const idx = characters.findIndex(ch => ch.id === currentId);
  if (idx !== -1) {
    characters[idx].imagePos   = pos;
    characters[idx].imageScale = parseFloat(_crop.scale.toFixed(3));
  }
}

function initCrop(c) {
  const wrap = document.getElementById('cropWrap');
  const img  = document.getElementById('cropImg');
  if (!wrap || !img) return;

  _crop.wrapW = wrap.offsetWidth  || 200;
  _crop.wrapH = wrap.offsetHeight || 260;

  function setupImage() {
    const natW = img.naturalWidth  || 200;
    const natH = img.naturalHeight || 260;
    const aspect = natW / natH;
    // ベースサイズ：短辺をwrapにフィットさせてスケール1.0を定義
    let bh = _crop.wrapH;
    let bw = bh * aspect;
    if (bw < _crop.wrapW) { bw = _crop.wrapW; bh = bw / aspect; }
    _crop.baseW = bw;
    _crop.baseH = bh;

    // 保存済みscaleを復元（デフォルト1.3でやや拡大）
    const savedScale = (c.imageScale && c.imageScale > 0) ? c.imageScale : 1.3;
    _crop.scale = savedScale;
    _crop.imgW = bw * savedScale;
    _crop.imgH = bh * savedScale;

    // 保存済みimagePos から位置を復元
    let ox = 50, oy = 30;
    if (c.imagePos && c.imagePos.includes('%')) {
      const parts = c.imagePos.trim().split(/\s+/);
      ox = parseFloat(parts[0]) || 50;
      oy = parseFloat(parts[1]) || 30;
    }
    _crop.imgX = -((ox / 100) * Math.max(0, _crop.imgW - _crop.wrapW));
    _crop.imgY = -((oy / 100) * Math.max(0, _crop.imgH - _crop.wrapH));
    _cropClamp();
    _cropApply();

    // スライダー初期値
    const sl = document.getElementById('cropZoomSlider');
    if (sl) sl.value = Math.round(savedScale * 100);
  }

  if (img.complete && img.naturalWidth) {
    setupImage();
  } else {
    img.onload = setupImage;
  }

  // ホイールズーム
  wrap.onwheel = e => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.05 : -0.05;
    _cropSetScale(_crop.scale + delta);
  };

  // mousedown / touchstart
  wrap.onmousedown = e => {
    e.preventDefault();
    _crop.dragging = true;
    _crop.startX = e.clientX;
    _crop.startY = e.clientY;
    wrap.classList.add('dragging');
  };
  wrap.ontouchstart = e => {
    e.stopPropagation();
    if (e.touches.length === 2) {
      _crop.pinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    } else {
      _crop.dragging = true;
      _crop.startX = e.touches[0].clientX;
      _crop.startY = e.touches[0].clientY;
    }
  };
}

function previewImage(url) {
  const wrap = document.getElementById('cropWrap');
  if (!wrap) return;
  const fixed = fixDropboxUrl(url);
  const idx = characters.findIndex(c => c.id === currentId);
  const c = idx !== -1 ? characters[idx] : {};
  if (url) {
    wrap.innerHTML = `<img id="cropImg" src="${fixed}" alt="" draggable="false"
        style="position:absolute;left:0;top:0;cursor:inherit">
      <div class="crop-hint"><div class="crop-hint-text">ドラッグで位置を調整</div></div>`;
    setTimeout(() => initCrop(c), 30);
  } else {
    wrap.innerHTML = `<div class="crop-placeholder"><div class="portrait-placeholder-text">画像なし</div></div>`;
  }
}

function setImagePos() {} // 互換用

function collectFormData() {
  const idx = characters.findIndex(c => c.id === currentId);
  if (idx === -1) return false;
  const c = characters[idx];
  c.name       = document.getElementById('f-name').value.trim();
  c.furigana   = document.getElementById('f-furigana').value.trim();
  c.age        = document.getElementById('f-age').value.trim();
  c.birthday   = document.getElementById('f-birthday')?.value.trim() || '';
  c.occupation = document.getElementById('f-occupation').value.trim();
  // カテゴリー：セレクトが__custom__ならテキスト入力値、それ以外はセレクト値
  const catSel = document.getElementById('f-category-select');
  const catInp = document.getElementById('f-category');
  if (catSel && catSel.value === '__custom__') {
    c.category = catInp ? catInp.value.trim() : '';
  } else {
    c.category = catSel ? catSel.value : (catInp ? catInp.value.trim() : '');
  }
  c.status     = document.getElementById('f-status').value;
  c.color      = document.getElementById('f-color').value;
  c.image      = document.getElementById('f-image').value.trim();
  // imagePos はsetImagePos()で直接characters[]に書き込み済みのためここでは維持
  c.profile    = document.getElementById('f-profile').value.trim();
  c.sessions   = [...sessions];
  c.stats = {};
  ['STR','CON','POW','DEX','APP','SIZ','INT','EDU'].forEach(stat => {
    const el = document.getElementById('stat-' + stat);
    if (el) c.stats[stat] = el.value === '' ? '' : (parseInt(el.value) || '');
  });
  const dbEl = document.getElementById('stat-DB');
  if (dbEl) c.stats['DB'] = dbEl.value.trim();
  // 特徴表
  c.traits = [];
  let ti = 0;
  while (document.getElementById(`trait-dice-${ti}`)) {
    const dice = document.getElementById(`trait-dice-${ti}`).value.trim();
    const text = document.getElementById(`trait-text-${ti}`).value.trim();
    if (dice || text) c.traits.push({ dice, text });
    ti++;
  }
  characters[idx] = c;
  return c;
}

function saveChar() {
  const c = collectFormData();
  if (!c) return;
  renderSidebar();
  const json = JSON.stringify(characters, null, 2);
  const jsonArea = document.getElementById('jsonArea');
  if (jsonArea) jsonArea.value = json;
  document.getElementById('editHeaderName').textContent = c.name || '（名前なし）';
  showToast('保存しました ✓');
}

async function saveAndPush() {
  saveChar();
  await pushToGitHub();
}

function exportJSON() {
  const json = JSON.stringify(characters, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    showToast('JSONをコピーしました ✓');
  }).catch(() => {
    const jsonArea = document.getElementById('jsonArea');
    if (jsonArea) { jsonArea.value = json; jsonArea.select(); }
    showToast('テキストエリアを選択してコピーしてください');
  });
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function onCategorySelect(val) {
  const inp = document.getElementById('f-category');
  if (!inp) return;
  if (val === '__custom__') {
    inp.style.display = 'block';
    inp.value = '';
    inp.focus();
  } else {
    inp.style.display = 'none';
    inp.value = val;
  }
}

let _traitCount = 0;
function addTrait() {
  const container = document.getElementById('traitsRows');
  if (!container) return;
  const i = _traitCount++;
  const row = document.createElement('div');
  row.className = 'trait-row';
  row.id = `trait-row-${i}`;
  row.style.cssText = 'display:flex;gap:0.4rem;margin-bottom:0.4rem;align-items:center';
  row.innerHTML = `
    <input style="width:70px;flex-shrink:0" placeholder="例: 1" id="trait-dice-${i}">
    <input style="flex:1" placeholder="特徴テキスト" id="trait-text-${i}">
    <button type="button" style="background:none;border:1px solid var(--border);color:var(--muted);padding:0.3rem 0.5rem;cursor:pointer;font-size:0.7rem;flex-shrink:0" onclick="this.parentElement.remove()">✕</button>`;
  container.appendChild(row);
}

function removeTrait(i) {
  document.getElementById(`trait-row-${i}`)?.remove();
}

init();

// ── インポート（複数ファイル一括対応）──
function handleImportFile(input) {
  const files = Array.from(input.files || []);
  if (!files.length) return;

  let successCount = 0;
  let failCount = 0;
  let lastChar = null;
  let processed = 0;

  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const raw = JSON.parse(e.target.result);
        const c = convertCharaSheet(raw);
        // 同名PCの重複チェック（任意でスキップせず追加）
        characters.push(c);
        lastChar = c;
        successCount++;
      } catch (err) {
        failCount++;
        console.error('インポート失敗:', file.name, err);
      }
      processed++;
      // 全ファイル処理完了時
      if (processed === files.length) {
        renderSidebar();
        if (lastChar) {
          currentId = lastChar.id;
          renderForm(lastChar);
        }
        let msg = `${successCount}件インポートしました ✓`;
        if (failCount) msg += `（${failCount}件失敗）`;
        showToast(msg, failCount > 0);
      }
    };
    reader.readAsText(file);
  });

  input.value = '';
}

function convertTraits(raw) {
  // feature_labels形式: ["（1-3）素早い", "（3-4）戦士"] → {dice, text}に分割
  if (Array.isArray(raw.feature_labels) && raw.feature_labels.length) {
    return raw.feature_labels.map(label => {
      const s = String(label).trim();
      // 先頭の（...）or (...) をダイス目として抽出
      const m = s.match(/^[（(]\s*([^）)]*)\s*[）)]\s*(.*)$/);
      if (m) {
        return { dice: m[1].trim(), text: m[2].trim() };
      }
      return { dice: '', text: s };
    }).filter(r => r.dice || r.text);
  }
  // いあきゃら形式: raw.table が [{dice, content}] or [{num, text}] 等
  const src = raw.table || raw.traits || raw.feature_table || [];
  if (!Array.isArray(src) || !src.length) return [];
  return src.map(row => ({
    dice: String(row.dice || row.num || row.roll || ''),
    text: String(row.content || row.text || row.feature || row.value || '')
  })).filter(r => r.dice || r.text);
}

// tags配列からCATEGORIESに一致するものを探す
function matchCategory(raw) {
  const tags = raw.tags || (raw.inputs && raw.inputs.tags) || [];
  if (!Array.isArray(tags)) return '';
  for (const tag of tags) {
    if (CATEGORIES.includes(tag)) return tag;
  }
  return '';
}

function convertCharaSheet(raw) {
  const inp = raw.inputs || {};
  const id = Date.now().toString() + '_' + Math.random().toString(36).slice(2, 9);
  const n = (v) => { const x = parseInt(v); return isNaN(x) ? '' : x; };
  const pow    = n(inp.pow);
  function calcDB(str, siz) {
    const total = (parseInt(str)||0) + (parseInt(siz)||0);
    if (total <= 12) return '-1d6';
    if (total <= 16) return '-1d4';
    if (total <= 24) return '0';
    if (total <= 32) return '+1d4';
    if (total <= 40) return '+1d6';
    return '+2d6';
  }
  let sessions = [];
  if (Array.isArray(raw.scenarios)) {
    sessions = raw.scenarios.flatMap(s => s.split('\n').map(l => l.trim()).filter(Boolean));
  } else if (typeof raw.scenarios === 'string') {
    sessions = raw.scenarios.split('\n').map(l => l.trim()).filter(Boolean);
  }
  // プロフィール：memosの最初のbodyを使用（改行保持）
  const profileBody = (raw.memos || [])
    .map(m => (m.body || '').trimEnd())
    .filter(Boolean)
    .join('\n\n')
    .trim();
  const status = inp.pc_status === 'dead' ? '死亡'
               : inp.pc_status === 'missing' ? '不明'
               : inp.pc_status === 'retire' ? '引退' : '生存';
  // 画像URL（char_image_url 優先、なければ charImage）
  const imageUrl = inp.char_image_url || inp.charImage || '';
  // 画像の位置・スケール
  const imagePos   = inp.charImagePos || '50% 20%';
  const imageScale = (typeof inp.charImageScale === 'number' && inp.charImageScale > 0)
    ? inp.charImageScale
    : (inp.char_image_zoom ? (parseInt(inp.char_image_zoom) / 100) : 1.0);

  return {
    id,
    name: inp.pcname || '', furigana: inp.furigana || '',
    age: inp.age || '', birthday: inp.birthday || '', occupation: inp.job || '',
    category: matchCategory(raw),
    image: imageUrl,
    imagePos: imagePos,
    imageScale: imageScale,
    color: inp.txtcolor || '#7c9bb5',
    stats: {
      STR: n(inp.str), CON: n(inp.con), POW: pow,
      DEX: n(inp.dex), APP: n(inp.app), SIZ: n(inp.siz),
      INT: n(inp.int_v), EDU: n(inp.edu),
      DB: calcDB(inp.str, inp.siz),
    },
    profile: profileBody,
    sessions, status,
    traits: convertTraits(raw),
  };
}
