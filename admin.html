<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>探索者編集 — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e10;
    --surface: #16161a;
    --surface2: #1e1e23;
    --border: #2a2a30;
    --text: #e8e6e0;
    --muted: #8a887e;
    --accent: #c9a96e;
    --accent-dim: rgba(201,169,110,0.12);
    --danger: #c47070;
    --success: #70c490;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Noto Serif JP', serif;
    min-height: 100vh;
  }

  /* ── Layout ── */
  .admin-layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 700px) {
    .admin-layout { grid-template-columns: 1fr; }
    .sidebar { position: static; border-right: none; border-bottom: 1px solid var(--border); }
  }

  /* ── Sidebar ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 2rem 1.25rem;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .sidebar-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--accent);
    letter-spacing: 0.2em;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .char-list { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; }

  .char-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.6rem 0.75rem;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
    font-size: 0.82rem;
  }
  .char-item:hover { border-color: var(--border); background: var(--surface2); }
  .char-item.active { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }

  .char-avatar {
    width: 32px; height: 32px;
    background: var(--bg);
    border: 1px solid var(--border);
    overflow: hidden;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    color: var(--muted);
  }
  .char-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top; }

  .char-item-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .char-delete-btn {
    background: none; border: none; color: var(--border);
    cursor: pointer; font-size: 0.8rem; padding: 0.1rem 0.3rem;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .char-delete-btn:hover { color: var(--danger); }

  .btn-new {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 0.6rem;
    font-family: 'Noto Serif JP', serif;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.15s;
    width: 100%;
  }
  .btn-new:hover { background: rgba(201,169,110,0.2); }

  /* ── Main ── */
  main { padding: 2rem; overflow-y: auto; }

  .main-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .main-title { font-size: 1.5rem; font-weight: 200; letter-spacing: 0.15em; }
  .main-subtitle { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }

  .btn-group { display: flex; gap: 0.5rem; }

  .btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.5rem 1.25rem;
    font-family: 'Noto Serif JP', serif;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .btn.primary:hover { background: rgba(201,169,110,0.22); }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  /* ── Form ── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 6rem 2rem; color: var(--muted); text-align: center; gap: 1rem;
  }
  .empty-icon { font-size: 2.5rem; opacity: 0.3; }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem 1.5rem;
  }
  @media (max-width: 550px) { .form-grid { grid-template-columns: 1fr; } }

  .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
  .form-group.full { grid-column: 1 / -1; }

  label {
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  input, textarea, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.5rem 0.75rem;
    font-family: 'Noto Serif JP', serif;
    font-size: 0.82rem;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 80px; line-height: 1.8; }

  input[type="color"] {
    padding: 0.2rem;
    height: 2.2rem;
    cursor: pointer;
  }

  .section-divider {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.2em;
    padding: 1.5rem 0 0.75rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1rem;
    grid-column: 1 / -1;
  }

  /* Portrait preview */
  .portrait-section {
    grid-column: 1 / -1;
    display: flex;
    gap: 1.5rem;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .portrait-preview {
    width: 120px; height: 160px;
    background: var(--surface2);
    border: 1px solid var(--border);
    overflow: hidden;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .portrait-preview img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .portrait-placeholder-text { font-size: 0.65rem; color: var(--muted); text-align: center; padding: 0.5rem; }
  .portrait-inputs { flex: 1; display: flex; flex-direction: column; gap: 0.75rem; min-width: 200px; }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
    grid-column: 1 / -1;
  }
  @media (max-width: 500px) { .stats-grid { grid-template-columns: repeat(2,1fr); } }

  .stat-input-group { display: flex; flex-direction: column; gap: 0.3rem; }
  .stat-input-group label { text-align: center; }
  .stat-input-group input { text-align: center; }

  /* Skills / Sessions tags input */
  .tags-input-wrap {
    display: flex; flex-direction: column; gap: 0.5rem;
  }
  .tags-display { display: flex; flex-wrap: wrap; gap: 0.4rem; min-height: 2rem; }
  .tag-chip {
    background: var(--accent-dim);
    border: 1px solid rgba(201,169,110,0.25);
    color: var(--accent);
    font-size: 0.68rem;
    padding: 0.15rem 0.5rem;
    display: flex; align-items: center; gap: 0.3rem;
  }
  .tag-chip button {
    background: none; border: none; color: inherit;
    cursor: pointer; font-size: 0.7rem; padding: 0; line-height: 1;
  }
  .tag-add-row { display: flex; gap: 0.4rem; }
  .tag-add-row input { flex: 1; }
  .tag-add-btn {
    background: var(--accent-dim); border: 1px solid var(--accent);
    color: var(--accent); padding: 0.4rem 0.75rem;
    cursor: pointer; font-size: 0.75rem; white-space: nowrap;
    font-family: 'Noto Serif JP', serif;
  }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 2rem; right: 2rem;
    background: var(--surface);
    border: 1px solid var(--success);
    color: var(--success);
    padding: 0.75rem 1.5rem;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
    z-index: 999;
  }
  .toast.show { opacity: 1; }

  /* ── JSON export area ── */
  .json-area {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: monospace;
    font-size: 0.72rem;
    padding: 1rem;
    width: 100%;
    min-height: 160px;
    resize: vertical;
    margin-top: 1rem;
  }

  .notice {
    background: var(--accent-dim);
    border: 1px solid rgba(201,169,110,0.25);
    padding: 0.75rem 1rem;
    font-size: 0.75rem;
    color: var(--muted);
    line-height: 1.8;
    margin-top: 1rem;
  }
  .notice strong { color: var(--accent); }
</style>
</head>
<body>

<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-title">✦ 探索者編集</div>
    <div class="char-list" id="charList"></div>
    <button class="btn-new" onclick="createNew()">＋ 新しい探索者を追加</button>
    <a href="index.html" style="text-decoration:none">
      <button class="btn" style="width:100%;margin-top:0.5rem">← 一覧ページへ戻る</button>
    </a>
  </aside>

  <!-- Main -->
  <main id="mainArea">
    <div class="empty-state">
      <div class="empty-icon">✦</div>
      <div>左のリストから探索者を選ぶか、<br>新しく追加してください</div>
    </div>
  </main>
</div>

<div class="toast" id="toast">保存しました</div>

<script>
// ── State ──
let characters = [];
let currentId = null;
let skills = [];
let sessions = [];

// ── Init ──
async function init() {
  try {
    const res = await fetch('characters.json?t=' + Date.now());
    characters = await res.json();
  } catch { characters = []; }
  renderSidebar();
}

// ── Sidebar ──
function renderSidebar() {
  const list = document.getElementById('charList');
  if (!characters.length) {
    list.innerHTML = '<div style="font-size:0.72rem;color:var(--muted);padding:0.5rem">探索者がいません</div>';
    return;
  }
  list.innerHTML = characters.map(c => `
    <div class="char-item ${c.id === currentId ? 'active' : ''}" onclick="selectChar('${c.id}')">
      <div class="char-avatar">
        ${c.image ? `<img src="${c.image}" alt="">` : c.name.charAt(0)}
      </div>
      <span class="char-item-name">${c.name}</span>
      <button class="char-delete-btn" onclick="event.stopPropagation();deleteChar('${c.id}')" title="削除">✕</button>
    </div>
  `).join('');
}

// ── Select ──
function selectChar(id) {
  currentId = id;
  const c = characters.find(x => x.id === id);
  renderSidebar();
  renderForm(c);
}

// ── Create new ──
function createNew() {
  const id = Date.now().toString();
  const c = {
    id, name: '新しい探索者', nameEn: '', age: '', occupation: '',
    concept: '', image: '', color: '#7c9bb5',
    stats: { STR:50, CON:50, SIZ:50, DEX:50, APP:50, INT:50, POW:50, EDU:60 },
    skills: [], profile: '', quote: '', player: '',
    sessions: [], status: '生存'
  };
  characters.push(c);
  currentId = id;
  renderSidebar();
  renderForm(c);
}

// ── Delete ──
function deleteChar(id) {
  if (!confirm('この探索者を削除しますか？')) return;
  characters = characters.filter(c => c.id !== id);
  if (currentId === id) {
    currentId = null;
    document.getElementById('mainArea').innerHTML = `
      <div class="empty-state"><div class="empty-icon">✦</div><div>探索者を選択してください</div></div>`;
  }
  renderSidebar();
}

// ── Form ──
function renderForm(c) {
  skills = [...(c.skills || [])];
  sessions = [...(c.sessions || [])];

  document.getElementById('mainArea').innerHTML = `
    <div class="main-header">
      <div>
        <div class="main-title">${c.name}</div>
        <div class="main-subtitle">ID: ${c.id}</div>
      </div>
      <div class="btn-group">
        <button class="btn primary" onclick="saveChar()">保存</button>
        <button class="btn danger" onclick="deleteChar('${c.id}')">削除</button>
      </div>
    </div>

    <div class="form-grid">

      <!-- 基本情報 -->
      <div class="section-divider">基本情報</div>

      <div class="form-group">
        <label>名前（漢字）</label>
        <input id="f-name" value="${esc(c.name)}">
      </div>
      <div class="form-group">
        <label>名前（ローマ字）</label>
        <input id="f-nameEn" value="${esc(c.nameEn)}">
      </div>
      <div class="form-group">
        <label>年齢</label>
        <input id="f-age" value="${esc(c.age)}">
      </div>
      <div class="form-group">
        <label>職業</label>
        <input id="f-occupation" value="${esc(c.occupation)}">
      </div>
      <div class="form-group">
        <label>コンセプト（一言）</label>
        <input id="f-concept" value="${esc(c.concept)}">
      </div>
      <div class="form-group">
        <label>担当PL</label>
        <input id="f-player" value="${esc(c.player)}">
      </div>
      <div class="form-group">
        <label>ステータス</label>
        <select id="f-status">
          ${['生存','死亡','不明','引退'].map(s =>
            `<option value="${s}" ${c.status===s?'selected':''}>${s}</option>`
          ).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>カードカラー</label>
        <input type="color" id="f-color" value="${c.color || '#7c9bb5'}">
      </div>

      <!-- 立ち絵 -->
      <div class="section-divider">立ち絵</div>
      <div class="portrait-section">
        <div class="portrait-preview" id="portraitPreview">
          ${c.image
            ? `<img src="${esc(c.image)}" alt="">`
            : `<div class="portrait-placeholder-text">画像なし</div>`}
        </div>
        <div class="portrait-inputs">
          <div class="form-group">
            <label>画像URL（外部リンク or GitHubリポジトリ内パス）</label>
            <input id="f-image" value="${esc(c.image)}"
              placeholder="images/rin.png  または  https://..." 
              oninput="previewImage(this.value)">
          </div>
          <div class="notice">
            <strong>画像の配置方法：</strong><br>
            リポジトリ内に <code>images/</code> フォルダを作り、<br>
            ファイルをアップロードして相対パスで指定できます。<br>
            （例: <code>images/rin.png</code>）<br>
            外部サービスのURLを直接貼ることも可能です。
          </div>
        </div>
      </div>

      <!-- プロフィール -->
      <div class="section-divider">プロフィール</div>
      <div class="form-group full">
        <label>自己紹介・背景</label>
        <textarea id="f-profile" rows="4">${esc(c.profile)}</textarea>
      </div>
      <div class="form-group full">
        <label>口癖・名言</label>
        <input id="f-quote" value="${esc(c.quote)}">
      </div>

      <!-- スキル -->
      <div class="section-divider">主要技能</div>
      <div class="form-group full">
        <div class="tags-input-wrap">
          <div class="tags-display" id="skillsTags"></div>
          <div class="tag-add-row">
            <input id="skillInput" placeholder="技能名を入力" onkeydown="if(event.key==='Enter'){addTag('skill');event.preventDefault()}">
            <button class="tag-add-btn" onclick="addTag('skill')">追加</button>
          </div>
        </div>
      </div>

      <!-- 能力値 -->
      <div class="section-divider">能力値</div>
      <div class="stats-grid">
        ${['STR','CON','SIZ','DEX','APP','INT','POW','EDU'].map(stat => `
          <div class="stat-input-group">
            <label>${stat}</label>
            <input id="stat-${stat}" type="number" min="1" max="99" value="${c.stats?.[stat] ?? 50}">
          </div>
        `).join('')}
      </div>

      <!-- シナリオ -->
      <div class="section-divider">参加シナリオ</div>
      <div class="form-group full">
        <div class="tags-input-wrap">
          <div class="tags-display" id="sessionsTags"></div>
          <div class="tag-add-row">
            <input id="sessionInput" placeholder="シナリオ名を入力" onkeydown="if(event.key==='Enter'){addTag('session');event.preventDefault()}">
            <button class="tag-add-btn" onclick="addTag('session')">追加</button>
          </div>
        </div>
      </div>

      <!-- エクスポート -->
      <div class="section-divider">JSON エクスポート / GitHub反映</div>
      <div class="form-group full">
        <div class="notice">
          <strong>GitHub Pagesでの更新方法：</strong><br>
          ① 下の「JSONをコピー」ボタンでデータをコピー<br>
          ② GitHubリポジトリの <code>characters.json</code> を開いて内容を置き換えて保存<br>
          ③ GitHub Pagesが自動で再デプロイ（通常1〜2分）
        </div>
        <button class="btn primary" style="margin-top:0.75rem" onclick="exportJSON()">📋 characters.json をコピー</button>
        <textarea class="json-area" id="jsonArea" readonly placeholder="「保存」後にJSONが表示されます"></textarea>
      </div>

    </div>
  `;

  renderTags('skill');
  renderTags('session');
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Tags ──
function renderTags(type) {
  const arr = type === 'skill' ? skills : sessions;
  const el = document.getElementById(type === 'skill' ? 'skillsTags' : 'sessionsTags');
  if (!el) return;
  el.innerHTML = arr.map((t, i) => `
    <span class="tag-chip">${t}
      <button onclick="removeTag('${type}', ${i})">✕</button>
    </span>
  `).join('');
}

function addTag(type) {
  const inputId = type === 'skill' ? 'skillInput' : 'sessionInput';
  const input = document.getElementById(inputId);
  const val = input.value.trim();
  if (!val) return;
  if (type === 'skill') skills.push(val);
  else sessions.push(val);
  input.value = '';
  renderTags(type);
}

function removeTag(type, i) {
  if (type === 'skill') skills.splice(i, 1);
  else sessions.splice(i, 1);
  renderTags(type);
}

// ── Preview ──
function previewImage(url) {
  const preview = document.getElementById('portraitPreview');
  if (!preview) return;
  preview.innerHTML = url
    ? `<img src="${url}" alt="" onerror="this.parentElement.innerHTML='<div class=portrait-placeholder-text>読み込み失敗</div>'">`
    : `<div class="portrait-placeholder-text">画像なし</div>`;
}

// ── Save ──
function saveChar() {
  const idx = characters.findIndex(c => c.id === currentId);
  if (idx === -1) return;

  const c = characters[idx];
  c.name = document.getElementById('f-name').value.trim() || c.name;
  c.nameEn = document.getElementById('f-nameEn').value.trim();
  c.age = document.getElementById('f-age').value.trim();
  c.occupation = document.getElementById('f-occupation').value.trim();
  c.concept = document.getElementById('f-concept').value.trim();
  c.player = document.getElementById('f-player').value.trim();
  c.status = document.getElementById('f-status').value;
  c.color = document.getElementById('f-color').value;
  c.image = document.getElementById('f-image').value.trim();
  c.profile = document.getElementById('f-profile').value.trim();
  c.quote = document.getElementById('f-quote').value.trim();
  c.skills = [...skills];
  c.sessions = [...sessions];

  c.stats = {};
  ['STR','CON','SIZ','DEX','APP','INT','POW','EDU'].forEach(stat => {
    const el = document.getElementById('stat-' + stat);
    c.stats[stat] = el ? parseInt(el.value) || 50 : 50;
  });

  characters[idx] = c;
  renderSidebar();

  // Show JSON
  const json = JSON.stringify(characters, null, 2);
  const jsonArea = document.getElementById('jsonArea');
  if (jsonArea) jsonArea.value = json;

  showToast('保存しました ✓');
}

function exportJSON() {
  const json = JSON.stringify(characters, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    showToast('JSONをクリップボードにコピーしました ✓');
  }).catch(() => {
    const jsonArea = document.getElementById('jsonArea');
    if (jsonArea) { jsonArea.value = json; jsonArea.select(); }
    showToast('テキストエリアを選択してコピーしてください');
  });
}

function showToast(msg = '保存しました ✓') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

init();
</script>
</body>
</html>
