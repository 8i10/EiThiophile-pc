<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>探索者一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0e0e10;--surface:#16161a;--border:#2a2a30;--text:#e8e6e0;--muted:#8a887e;--accent:#c9a96e;--accent-dim:rgba(201,169,110,0.15); }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Serif JP',serif;min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(201,169,110,0.06) 0%,transparent 70%);pointer-events:none;z-index:0;}

  header{position:relative;z-index:1;padding:4rem 2rem 2rem;text-align:center;border-bottom:1px solid var(--border);}
  h1{font-size:clamp(1.2rem,3vw,2rem);font-weight:200;letter-spacing:0.5em;opacity:0;animation:fadeUp 0.8s ease forwards 0.2s;}
  .header-line{display:flex;align-items:center;gap:1rem;justify-content:center;margin-top:1.5rem;opacity:0;animation:fadeUp 0.8s ease forwards 0.35s;}
  .header-line::before,.header-line::after{content:'';flex:1;max-width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--accent));}
  .header-line::after{background:linear-gradient(90deg,var(--accent),transparent);}
  .header-ornament{color:var(--accent);font-family:'Cormorant Garamond',serif;font-size:1.2rem;}

  /* 検索 */
  .search-wrap{position:relative;z-index:1;display:flex;justify-content:flex-end;padding:1.5rem 2rem 0;opacity:0;animation:fadeUp 0.8s ease forwards 0.45s;}
  .search-input{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:0.5rem 1rem 0.5rem 2.2rem;font-family:'Noto Serif JP',serif;font-size:0.8rem;width:280px;outline:none;transition:border-color 0.2s;}
  .search-input:focus{border-color:var(--accent);}
  .search-icon{position:absolute;right:calc(2rem + 258px);top:50%;transform:translateY(-50%);color:var(--muted);font-size:0.8rem;pointer-events:none;}

  /* フィルター */
  .controls{position:relative;z-index:1;display:flex;flex-direction:column;gap:0.5rem;align-items:center;padding:1rem 2rem;opacity:0;animation:fadeUp 0.8s ease forwards 0.5s;}
  .filter-group{display:flex;gap:0.4rem;flex-wrap:wrap;justify-content:center;}
  .filter-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.3rem 0.85rem;font-family:'Noto Serif JP',serif;font-size:0.7rem;letter-spacing:0.08em;cursor:pointer;transition:all 0.2s;}
  .filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}

  /* グリッド */
  .grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.5rem;padding:1.5rem 2rem 2rem;max-width:1200px;margin:0 auto;}

  /* カード */
  .card{background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:transform 0.25s ease,border-color 0.25s ease,box-shadow 0.25s ease;opacity:0;animation:fadeUp 0.6s ease forwards;position:relative;overflow:hidden;}
  .card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 40px rgba(0,0,0,0.4),0 0 0 1px var(--accent-dim);}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity 0.25s;}
  .card:hover::before{opacity:1;}
  .card-portrait{width:100%;height:200px;background:#1a1a1f;overflow:hidden;position:relative;}
  .card-portrait img{width:100%;height:100%;object-fit:cover;transition:transform 0.4s ease;transform-origin:var(--img-ox,50%) var(--img-oy,20%);}
  .card:hover .card-portrait img{transform:scale(calc(var(--img-scale,1.0) * 1.04));}
  .card-portrait-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .placeholder-monogram{font-family:'Cormorant Garamond',serif;font-size:4rem;font-weight:300;opacity:0.2;}
  .card-status-badge{position:absolute;top:10px;right:10px;padding:0.2rem 0.6rem;font-size:0.65rem;letter-spacing:0.1em;font-family:'Cormorant Garamond',serif;}
  .status-生存{background:rgba(100,160,100,0.2);color:#8cc48c;border:1px solid rgba(100,160,100,0.4);}
  .status-死亡{background:rgba(160,80,80,0.2);color:#c48c8c;border:1px solid rgba(160,80,80,0.4);}
  .status-不明{background:rgba(160,160,100,0.2);color:#c4c48c;border:1px solid rgba(160,160,100,0.4);}
  .status-引退{background:rgba(100,100,160,0.2);color:#8c8cc4;border:1px solid rgba(100,100,160,0.4);}
  .card-body{padding:1rem 1.25rem 1.25rem;}
  .card-furigana{font-size:0.6rem;color:var(--muted);letter-spacing:0.18em;margin-bottom:0.12rem;}
  .card-name{font-size:1.05rem;font-weight:300;letter-spacing:0.1em;margin-bottom:0.6rem;}
  .card-meta{display:flex;gap:0.75rem;font-size:0.7rem;color:var(--muted);padding-bottom:0.6rem;border-bottom:1px solid var(--border);margin-bottom:0.6rem;}
  .card-quote{font-size:0.65rem;color:var(--muted);line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* モーダル */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;display:flex;align-items:center;justify-content:center;padding:1.5rem;opacity:0;pointer-events:none;transition:opacity 0.2s;backdrop-filter:blur(4px);}
  .modal-overlay.open{opacity:1;pointer-events:all;}
  .modal{background:var(--surface);border:1px solid var(--border);max-width:720px;width:100%;max-height:90vh;overflow-y:auto;transform:translateY(16px);transition:transform 0.2s;position:relative;}
  .modal-overlay.open .modal{transform:translateY(0);}
  .modal-close{position:absolute;top:1rem;right:1rem;background:none;border:1px solid var(--border);color:var(--muted);width:2rem;height:2rem;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s;z-index:10;}
  .modal-close:hover{border-color:var(--accent);color:var(--accent);}
  .modal-top{display:grid;grid-template-columns:240px 1fr;}
  @media(max-width:560px){.modal-top{grid-template-columns:1fr;}}
  .modal-portrait{background:#1a1a1f;min-height:300px;overflow:hidden;}
  .modal-portrait img{width:100%;height:100%;object-fit:cover;transform-origin:var(--img-ox,50%) var(--img-oy,20%);transform:scale(var(--img-scale,1.0));}
  .modal-portrait-placeholder{width:100%;height:100%;min-height:300px;display:flex;align-items:center;justify-content:center;}
  .modal-info{padding:2rem;overflow-y:auto;}
  .modal-furigana{font-size:0.7rem;color:var(--muted);letter-spacing:0.2em;margin-bottom:0.3rem;}
  .modal-name{font-size:1.4rem;font-weight:200;letter-spacing:0.1em;margin-bottom:1rem;}
  .modal-meta-row{display:flex;gap:1.5rem;flex-wrap:wrap;font-size:0.75rem;color:var(--muted);padding:0.75rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:0;}
  .modal-meta-row span strong{color:var(--text);display:block;font-weight:400;font-size:0.85rem;}

  /* ステータス（右パネル内・メタ情報の直下） */
  .modal-stats-inline{margin-top:1rem;}
  .modal-stats-inline .stats-block-label{font-size:0.6rem;color:var(--muted);letter-spacing:0.12em;margin-bottom:0.3rem;margin-top:0.6rem;}
  .modal-stats-inline .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0.3rem;}
  .modal-stats-inline .stats-row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:0.3rem;}
  .stat-item{background:var(--bg);border:1px solid var(--border);padding:0.4rem 0.3rem;text-align:center;}
  .stat-label{font-size:0.55rem;color:var(--muted);letter-spacing:0.08em;}
  .stat-val{font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--accent);}

  .modal-body{padding:0 2rem 2rem;}
  .modal-section-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.8rem;color:var(--accent);letter-spacing:0.2em;margin-bottom:0.6rem;margin-top:1.5rem;}
  .modal-profile{font-size:0.82rem;line-height:2;color:var(--text);opacity:0.9;white-space:pre-wrap;}
  .modal-quote{border-left:2px solid var(--accent);padding-left:1rem;font-style:italic;font-size:0.82rem;color:var(--muted);line-height:1.8;margin-top:1rem;}

  /* 特徴表 */
  .traits-table{width:100%;border-collapse:collapse;font-size:0.78rem;margin-top:0.5rem;}
  .traits-table th{background:rgba(201,169,110,0.08);color:var(--accent);font-weight:400;letter-spacing:0.08em;padding:0.4rem 0.6rem;border:1px solid var(--border);font-size:0.7rem;}
  .traits-table td{padding:0.4rem 0.6rem;border:1px solid var(--border);color:var(--text);line-height:1.6;vertical-align:top;}
  .traits-table tr:nth-child(even) td{background:rgba(255,255,255,0.02);}

  /* アコーディオン */
  .accordion{border:1px solid var(--border);margin-top:1rem;}
  .accordion-header{display:flex;align-items:center;justify-content:space-between;padding:0.6rem 0.9rem;cursor:pointer;font-size:0.75rem;color:var(--muted);letter-spacing:0.08em;user-select:none;transition:background 0.15s,color 0.15s;}
  .accordion-header:hover{background:rgba(255,255,255,0.03);color:var(--text);}
  .accordion-title{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--accent);font-size:0.8rem;letter-spacing:0.15em;}
  .accordion-count{font-size:0.68rem;color:var(--muted);margin-left:0.5rem;}
  .accordion-arrow{font-size:0.6rem;transition:transform 0.2s;color:var(--accent);}
  .accordion.open .accordion-arrow{transform:rotate(180deg);}
  .accordion-body{display:none;padding:0.75rem 1rem 1rem;border-top:1px solid var(--border);}
  .accordion.open .accordion-body{display:block;}
  .session-list{list-style:none;display:flex;flex-direction:column;gap:0.4rem;}
  .session-list li{font-size:0.78rem;color:var(--muted);padding-left:1em;position:relative;line-height:1.6;}
  .session-list li::before{content:'—';position:absolute;left:0;color:var(--accent);font-size:0.7rem;}

  footer{position:relative;z-index:1;text-align:center;padding:3rem 2rem;border-top:1px solid var(--border);margin-top:2rem;}
  .footer-link{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.8rem;color:var(--muted);text-decoration:none;letter-spacing:0.1em;border:1px solid var(--border);padding:0.4rem 1.2rem;transition:all 0.2s;}
  .footer-link:hover{color:var(--accent);border-color:var(--accent);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<header>
  <h1>探索者一覧</h1>
  <div class="header-line"><span class="header-ornament">✦</span></div>
</header>

<!-- 検索ボックス -->
<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input class="search-input" id="searchInput" type="text" placeholder="PC名・ふりがな・通過シナリオで検索…" oninput="renderGrid()">
</div>

<!-- フィルター -->
<div class="controls" id="controls"></div>

<div class="grid" id="grid"></div>

<footer>
  <a href="login.html" class="footer-link">✎ 編集ページへ</a>
</footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-top">
      <div class="modal-portrait" id="modalPortrait"></div>
      <div class="modal-info">
        <div class="modal-furigana" id="modalFurigana"></div>
        <div class="modal-name" id="modalName"></div>
        <div class="modal-meta-row" id="modalMeta"></div>
        <!-- ステータス：メタ情報の直下 -->
        <div class="modal-stats-inline" id="modalStatsInline"></div>
      </div>
    </div>
    <div class="modal-body">
      <!-- プロフィール -->
      <div class="modal-section-title">プロフィール</div>
      <div class="modal-profile" id="modalProfile"></div>
      <div class="modal-quote" id="modalQuote"></div>
      <!-- 特徴表 -->
      <div id="modalTraitsWrap"></div>
      <!-- 通過シナリオ -->
      <div id="modalSessionsWrap" style="margin-top:1.5rem"></div>
    </div>
  </div>
</div>

<script>
let characters = [];
let activeFilter = 'all';
let activeCat = 'all';

function fixDropboxUrl(url) {
  if (!url) return url;
  if (url.includes('dropbox.com')) {
    return url.replace('www.dropbox.com','dl.dropboxusercontent.com')
              .replace(/[?&]dl=\d/,'').replace(/[?&]raw=\d/,'');
  }
  return url;
}

async function loadCharacters() {
  try {
    const res = await fetch('characters.json?t=' + Date.now());
    characters = await res.json();
  } catch { characters = []; }
  renderFilters();
  renderGrid();
}

function renderFilters() {
  const ctrl = document.getElementById('controls');
  const cats = ['all', ...new Set(characters.map(c => c.category).filter(Boolean))];
  const catBtns = cats.map(s =>
    `<button class="filter-btn ${s===activeCat?'active':''}" onclick="setCat('${s.replace(/'/g,"\\'")}')">
      ${s==='all'?'すべて':s}</button>`).join('');
  ctrl.innerHTML = `<div class="filter-group">${catBtns}</div>`;
}

function setFilter(f) { activeFilter = activeFilter===f?'all':f; renderFilters(); renderGrid(); }
function setCat(c)    { activeCat = c; renderFilters(); renderGrid(); }

function renderGrid() {
  const q = (document.getElementById('searchInput')?.value||'').trim().toLowerCase();
  let filtered = characters;
  if (activeCat !== 'all') filtered = filtered.filter(c => c.category === activeCat);
  if (q) filtered = filtered.filter(c =>
    (c.name||'').toLowerCase().includes(q) ||
    (c.furigana||'').toLowerCase().includes(q) ||
    (c.sessions||[]).some(s => s.toLowerCase().includes(q))
  );

  document.getElementById('grid').innerHTML = filtered.map((c, i) => {
    const cardLine = c.quote || (c.sessions&&c.sessions[0]) || '';
    const pos = c.imagePos || '50% 20%';
    const [ox, oy] = pos.split(' ');
    const sc = c.imageScale || 1.0;
    return `
    <div class="card" style="animation-delay:${i*0.07}s" onclick="openModal('${c.id}')">
      <div class="card-portrait" style="background:linear-gradient(160deg,${c.color||'#7c9bb5'}22,#1a1a1f)">
        ${c.image
          ?`<img src="${fixDropboxUrl(c.image)}" alt="${c.name}" loading="lazy" style="object-position:${pos};--img-ox:${ox};--img-oy:${oy};--img-scale:${sc};transform:scale(${sc});transform-origin:${ox} ${oy}">`
          :`<div class="card-portrait-placeholder"><span class="placeholder-monogram">${c.name?c.name.charAt(0):'?'}</span></div>`}
        ${c.status?`<span class="card-status-badge status-${c.status}">${c.status}</span>`:''}
      </div>
      <div class="card-body">
        ${c.furigana?`<div class="card-furigana">${c.furigana}</div>`:''}
        <div class="card-name">${c.name||'（名前なし）'}</div>
        <div class="card-meta">
          ${c.age?`<span>${c.age}歳</span>`:''}
          ${c.occupation?`<span>${c.occupation}</span>`:''}
        </div>
        ${cardLine?`<div class="card-quote">${cardLine}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function openModal(id) {
  const c = characters.find(x => x.id === id);
  if (!c) return;

  document.getElementById('modalFurigana').textContent = c.furigana || '';
  document.getElementById('modalName').textContent = c.name || '';
  document.getElementById('modalProfile').textContent = c.profile || '';

  const qEl = document.getElementById('modalQuote');
  qEl.textContent = c.quote || '';
  qEl.style.display = c.quote ? '' : 'none';

  document.getElementById('modalMeta').innerHTML = `
    ${c.age?`<span>年齢<strong>${c.age}歳</strong></span>`:''}
    ${c.occupation?`<span>職業<strong>${c.occupation}</strong></span>`:''}
    <span>誕生日<strong>${c.birthday||'未設定'}</strong></span>
    ${c.status?`<span>状態<strong>${c.status}</strong></span>`:''}`;

  const pos = c.imagePos || '50% 20%';
  const [ox, oy] = pos.split(' ');
  const sc = c.imageScale || 1.0;
  document.getElementById('modalPortrait').innerHTML = c.image
    ? `<img src="${fixDropboxUrl(c.image)}" alt="${c.name}" style="object-position:${pos};transform:scale(${sc});transform-origin:${ox} ${oy}">`
    : `<div class="modal-portrait-placeholder"><span class="placeholder-monogram" style="font-size:5rem;opacity:0.15">${c.name?c.name.charAt(0):'?'}</span></div>`;

  // ステータス（右パネル内）
  const statsInline = document.getElementById('modalStatsInline');
  const primary   = ['STR','CON','POW','DEX','APP','SIZ','INT','EDU'];
  const secondary = ['HP','MP','SAN','アイデア','幸運','知識'];
  const hasAny = keys => c.stats && keys.some(k => c.stats[k]!==''&&c.stats[k]!=null);
  if (c.stats && Object.keys(c.stats).some(k=>c.stats[k]!==''&&c.stats[k]!=null)) {
    let html='';
    if (hasAny(primary)) {
      html+=`<div class="stats-block-label">基本能力値</div><div class="stats-row">`+
        primary.filter(k=>c.stats[k]!==''&&c.stats[k]!=null).map(k=>
          `<div class="stat-item"><div class="stat-label">${k}</div><div class="stat-val">${c.stats[k]}</div></div>`
        ).join('')+`</div>`;
    }
    if (hasAny(secondary)) {
      html+=`<div class="stats-block-label" style="margin-top:0.5rem">二次ステータス</div><div class="stats-row-3">`+
        secondary.filter(k=>c.stats[k]!==''&&c.stats[k]!=null).map(k=>
          `<div class="stat-item"><div class="stat-label">${k}</div><div class="stat-val">${c.stats[k]}</div></div>`
        ).join('')+`</div>`;
    }
    if (c.stats['DB']!==''&&c.stats['DB']!=null)
      html+=`<div class="stats-row" style="margin-top:0.3rem"><div class="stat-item"><div class="stat-label">DB</div><div class="stat-val" style="font-size:0.9rem">${c.stats['DB']}</div></div></div>`;
    statsInline.innerHTML = html;
  } else {
    statsInline.innerHTML = '';
  }

  // 特徴表
  const traitsWrap = document.getElementById('modalTraitsWrap');
  if (c.traits && c.traits.length) {
    traitsWrap.innerHTML = `
      <div class="modal-section-title">特徴表</div>
      <table class="traits-table">
        <thead><tr><th>ダイス</th><th>特徴</th></tr></thead>
        <tbody>${c.traits.map(t=>`<tr><td>${t.dice||''}</td><td>${t.text||''}</td></tr>`).join('')}</tbody>
      </table>`;
  } else {
    traitsWrap.innerHTML = '';
  }

  // 通過シナリオ アコーディオン
  const sessWrap = document.getElementById('modalSessionsWrap');
  if (c.sessions && c.sessions.length) {
    sessWrap.innerHTML = `
      <div class="accordion" id="sessAccordion">
        <div class="accordion-header" onclick="toggleAccordion()">
          <span><span class="accordion-title">通過シナリオ</span><span class="accordion-count">${c.sessions.length}件</span></span>
          <span class="accordion-arrow">▼</span>
        </div>
        <div class="accordion-body">
          <ul class="session-list">${c.sessions.map(s=>`<li>${s}</li>`).join('')}</ul>
        </div>
      </div>`;
  } else {
    sessWrap.innerHTML = '';
  }

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function toggleAccordion() {
  document.getElementById('sessAccordion')?.classList.toggle('open');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

loadCharacters();
</script>
</body>
</html>
