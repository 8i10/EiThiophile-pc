<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>探索者名簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e10;
    --surface: #16161a;
    --border: #2a2a30;
    --text: #e8e6e0;
    --muted: #8a887e;
    --accent: #c9a96e;
    --accent-dim: rgba(201,169,110,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif JP', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,169,110,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 4rem 2rem 2rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }

  .header-label {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.85rem;
    color: var(--accent);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 1rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.1s;
  }

  h1 {
    font-size: clamp(1.2rem, 3vw, 2rem);
    font-weight: 200;
    letter-spacing: 0.5em;
    color: var(--text);
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.2s;
  }

  .header-line {
    display: flex;
    align-items: center;
    gap: 1rem;
    justify-content: center;
    margin-top: 1.5rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.35s;
  }
  .header-line::before, .header-line::after {
    content: '';
    flex: 1;
    max-width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent));
  }
  .header-line::after { background: linear-gradient(90deg, var(--accent), transparent); }
  .header-ornament { color: var(--accent); font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; }

  .controls {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    flex-wrap: wrap;
    padding: 2rem 2rem 1rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.5s;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.4rem 1.2rem;
    font-family: 'Noto Serif JP', serif;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }

  .grid {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem;
    padding: 2rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px var(--accent-dim);
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.25s;
  }
  .card:hover::before { opacity: 1; }

  .card-portrait {
    width: 100%;
    height: 220px;
    background: #1a1a1f;
    overflow: hidden;
    position: relative;
  }
  .card-portrait img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: top;
    transition: transform 0.4s ease;
  }
  .card:hover .card-portrait img { transform: scale(1.03); }

  .card-portrait-placeholder {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .placeholder-monogram {
    font-family: 'Cormorant Garamond', serif;
    font-size: 4rem;
    font-weight: 300;
    opacity: 0.2;
  }

  .card-status-badge {
    position: absolute;
    top: 10px; right: 10px;
    padding: 0.2rem 0.6rem;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    font-family: 'Cormorant Garamond', serif;
  }
  .status-生存 { background: rgba(100,160,100,0.2); color: #8cc48c; border: 1px solid rgba(100,160,100,0.4); }
  .status-死亡 { background: rgba(160,80,80,0.2);  color: #c48c8c; border: 1px solid rgba(160,80,80,0.4); }
  .status-不明 { background: rgba(160,160,100,0.2);color: #c4c48c; border: 1px solid rgba(160,160,100,0.4); }
  .status-引退 { background: rgba(100,100,160,0.2); color: #8c8cc4; border: 1px solid rgba(100,100,160,0.4); }

  .card-body { padding: 1.25rem 1.5rem 1.5rem; }

  /* ふりがな + 名前 */
  .card-furigana {
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 0.18em;
    margin-bottom: 0.15rem;
  }
  .card-name {
    font-size: 1.4rem;
    font-weight: 300;
    letter-spacing: 0.1em;
    margin-bottom: 0.75rem;
  }

  .card-meta {
    display: flex;
    gap: 1rem;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.75rem;
  }

  .card-skills {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 0.75rem;
  }
  .skill-tag {
    background: var(--accent-dim);
    border: 1px solid rgba(201,169,110,0.2);
    color: var(--accent);
    font-size: 0.65rem;
    padding: 0.15rem 0.5rem;
    letter-spacing: 0.08em;
  }

  .card-quote {
    font-size: 0.75rem;
    color: var(--muted);
    font-style: italic;
    line-height: 1.6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    max-width: 720px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    transform: translateY(16px);
    transition: transform 0.2s;
    position: relative;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-close {
    position: absolute;
    top: 1rem; right: 1rem;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 2rem; height: 2rem;
    cursor: pointer;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    z-index: 10;
  }
  .modal-close:hover { border-color: var(--accent); color: var(--accent); }

  .modal-top {
    display: grid;
    grid-template-columns: 240px 1fr;
  }
  @media (max-width: 560px) { .modal-top { grid-template-columns: 1fr; } }

  .modal-portrait {
    background: #1a1a1f;
    min-height: 300px;
    overflow: hidden;
  }
  .modal-portrait img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .modal-portrait-placeholder {
    width: 100%; height: 100%; min-height: 300px;
    display: flex; align-items: center; justify-content: center;
  }

  .modal-info { padding: 2rem; }
  .modal-furigana { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.2em; margin-bottom: 0.3rem; }
  .modal-name { font-size: 1.8rem; font-weight: 200; letter-spacing: 0.12em; margin-bottom: 1rem; }

  .modal-meta-row {
    display: flex; gap: 2rem; flex-wrap: wrap;
    font-size: 0.75rem; color: var(--muted);
    padding: 0.75rem 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-bottom: 1rem;
  }
  .modal-meta-row span strong {
    color: var(--text);
    display: block;
    font-weight: 400;
    font-size: 0.85rem;
  }

  .modal-body { padding: 0 2rem 2rem; }
  .modal-section-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.2em;
    margin-bottom: 0.6rem;
    margin-top: 1.5rem;
  }

  .modal-profile { font-size: 0.82rem; line-height: 2; color: var(--text); opacity: 0.9; }
  .modal-quote {
    border-left: 2px solid var(--accent);
    padding-left: 1rem;
    font-style: italic;
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.8;
    margin-top: 1rem;
  }

  .modal-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
    margin-top: 0.5rem;
  }
  .stat-item { background: var(--bg); border: 1px solid var(--border); padding: 0.5rem; text-align: center; }
  .stat-label { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.1em; }
  .stat-val { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; color: var(--accent); }

  .modal-sessions { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .session-tag {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.68rem;
    padding: 0.2rem 0.6rem;
    letter-spacing: 0.08em;
  }

  footer {
    position: relative; z-index: 1;
    text-align: center;
    padding: 3rem 2rem;
    border-top: 1px solid var(--border);
    margin-top: 2rem;
  }
  .footer-link {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.8rem;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.1em;
    border: 1px solid var(--border);
    padding: 0.4rem 1.2rem;
    transition: all 0.2s;
  }
  .footer-link:hover { color: var(--accent); border-color: var(--accent); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<header>
  <h1>探索者一覧</h1>
  <div class="header-line"><span class="header-ornament">✦</span></div>
</header>

<div class="controls" id="controls"></div>
<div class="grid" id="grid"></div>

<footer>
  <a href="admin.html" class="footer-link">✎ 編集ページへ</a>
</footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-top">
      <div class="modal-portrait" id="modalPortrait"></div>
      <div class="modal-info">
        <div class="modal-furigana" id="modalFurigana"></div>
        <div class="modal-name" id="modalName"></div>
        <div class="modal-meta-row" id="modalMeta"></div>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-section-title">プロフィール</div>
      <div class="modal-profile" id="modalProfile"></div>
      <div class="modal-quote" id="modalQuote"></div>
      <div class="modal-section-title">能力値</div>
      <div class="modal-stats" id="modalStats"></div>
      <div class="modal-section-title">参加シナリオ</div>
      <div class="modal-sessions" id="modalSessions"></div>
    </div>
  </div>
</div>

<script>
let characters = [];
let activeFilter = 'all';

// Dropbox共有URLを直接表示できるURLに変換
function fixDropboxUrl(url) {
  if (!url) return url;
  // https://www.dropbox.com/s/xxx/file.png?dl=0 → ?dl=1 (直接ダウンロード)
  // または ?raw=1 で生データ表示
  if (url.includes('dropbox.com')) {
    return url
      .replace('www.dropbox.com', 'dl.dropboxusercontent.com')
      .replace(/[?&]dl=\d/, '')
      .replace(/[?&]raw=\d/, '');
  }
  return url;
}

async function loadCharacters() {
  try {
    const res = await fetch('characters.json?t=' + Date.now());
    characters = await res.json();
  } catch { characters = []; }
  renderFilters();
  renderGrid();
}

function renderFilters() {
  const statuses = ['all', ...new Set(characters.map(c => c.status).filter(Boolean))];
  document.getElementById('controls').innerHTML = statuses.map(s => `
    <button class="filter-btn ${s === activeFilter ? 'active' : ''}" onclick="setFilter('${s}')">
      ${s === 'all' ? 'すべて' : s}
    </button>
  `).join('');
}

function setFilter(f) {
  activeFilter = f;
  renderFilters();
  renderGrid();
}

function renderGrid() {
  const filtered = activeFilter === 'all' ? characters : characters.filter(c => c.status === activeFilter);
  const imgUrl = (c) => fixDropboxUrl(c.image);

  document.getElementById('grid').innerHTML = filtered.map((c, i) => `
    <div class="card" style="animation-delay:${i * 0.07}s" onclick="openModal('${c.id}')">
      <div class="card-portrait" style="background: linear-gradient(160deg, ${c.color || '#7c9bb5'}22, #1a1a1f)">
        ${c.image
          ? `<img src="${imgUrl(c)}" alt="${c.name}" loading="lazy">`
          : `<div class="card-portrait-placeholder"><span class="placeholder-monogram">${c.name.charAt(0)}</span></div>`}
        ${c.status ? `<span class="card-status-badge status-${c.status}">${c.status}</span>` : ''}
      </div>
      <div class="card-body">
        ${c.furigana ? `<div class="card-furigana">${c.furigana}</div>` : ''}
        <div class="card-name">${c.name}</div>
        <div class="card-meta">
          ${c.age ? `<span>${c.age}歳</span>` : ''}
          ${c.occupation ? `<span>${c.occupation}</span>` : ''}
        </div>
        ${c.skills?.length ? `<div class="card-skills">${c.skills.slice(0,4).map(s => `<span class="skill-tag">${s}</span>`).join('')}</div>` : ''}
        ${c.quote ? `<div class="card-quote">${c.quote}</div>` : ''}
      </div>
    </div>
  `).join('');
}

function openModal(id) {
  const c = characters.find(x => x.id === id);
  if (!c) return;

  document.getElementById('modalFurigana').textContent = c.furigana || '';
  document.getElementById('modalName').textContent = c.name;
  document.getElementById('modalProfile').textContent = c.profile || '';
  document.getElementById('modalQuote').textContent = c.quote || '';

  document.getElementById('modalMeta').innerHTML = `
    ${c.age ? `<span>年齢<strong>${c.age}歳</strong></span>` : ''}
    ${c.occupation ? `<span>職業<strong>${c.occupation}</strong></span>` : ''}
    ${c.status ? `<span>状態<strong>${c.status}</strong></span>` : ''}
  `;

  const imgUrl = fixDropboxUrl(c.image);
  document.getElementById('modalPortrait').innerHTML = c.image
    ? `<img src="${imgUrl}" alt="${c.name}">`
    : `<div class="modal-portrait-placeholder"><span class="placeholder-monogram" style="font-size:5rem;opacity:0.15">${c.name.charAt(0)}</span></div>`;

  const statsEl = document.getElementById('modalStats');
  if (c.stats && Object.keys(c.stats).some(k => c.stats[k] !== '')) {
    const primary = ['STR','CON','POW','DEX','APP','SIZ','INT','EDU'];
    const secondary = ['HP','MP','SAN','アイデア','幸運','知識'];
    const hasAny = (keys) => keys.some(k => c.stats[k] !== '' && c.stats[k] !== undefined);
    let html = '';
    if (hasAny(primary)) {
      html += `<div style="grid-column:1/-1;font-size:0.62rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:-0.25rem">基本能力値</div>`;
      html += `<div style="grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:0.5rem">` +
        primary.filter(k => c.stats[k] !== '' && c.stats[k] !== undefined).map(k =>
          `<div class="stat-item"><div class="stat-label">${k}</div><div class="stat-val">${c.stats[k]}</div></div>`
        ).join('') + `</div>`;
    }
    if (hasAny(secondary)) {
      html += `<div style="grid-column:1/-1;font-size:0.62rem;color:var(--muted);letter-spacing:0.1em;margin-top:0.75rem;margin-bottom:-0.25rem">二次ステータス</div>`;
      html += `<div style="grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem">` +
        secondary.filter(k => c.stats[k] !== '' && c.stats[k] !== undefined).map(k =>
          `<div class="stat-item"><div class="stat-label">${k}</div><div class="stat-val">${c.stats[k]}</div></div>`
        ).join('') + `</div>`;
    }
    if (c.stats['DB'] !== '' && c.stats['DB'] !== undefined) {
      html += `<div style="grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:0.5rem;margin-top:0.5rem">` +
        `<div class="stat-item"><div class="stat-label">DB</div><div class="stat-val" style="font-size:1rem">${c.stats['DB']}</div></div></div>`;
    }
    statsEl.innerHTML = html || '<div style="color:var(--muted);font-size:0.75rem">データなし</div>';
  } else {
    statsEl.innerHTML = '<div style="color:var(--muted);font-size:0.75rem">データなし</div>';
  }

  document.getElementById('modalSessions').innerHTML = c.sessions?.length
    ? c.sessions.map(s => `<span class="session-tag">${s}</span>`).join('')
    : '<span style="color:var(--muted);font-size:0.75rem">参加記録なし</span>';

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

document.getElementById('modalClose').onclick =
document.getElementById('modalOverlay').onclick = function(e) {
  if (e.target === this || e.target.id === 'modalClose') {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }
});

loadCharacters();
</script>
</body>
</html>
