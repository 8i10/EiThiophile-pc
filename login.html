<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e0e10;--surface:#16161a;--border:#2a2a30;--text:#e8e6e0;--muted:#8a887e;--accent:#c9a96e;--accent-dim:rgba(201,169,110,0.15);--danger:#c47070;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Serif JP',serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(201,169,110,0.06) 0%,transparent 70%);pointer-events:none;}
  .box{background:var(--surface);border:1px solid var(--border);padding:3rem 2.5rem;width:100%;max-width:360px;position:relative;z-index:1;}
  .title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;color:var(--accent);letter-spacing:0.2em;text-align:center;margin-bottom:0.5rem;}
  .subtitle{font-size:0.72rem;color:var(--muted);text-align:center;letter-spacing:0.1em;margin-bottom:2rem;}
  .form-group{display:flex;flex-direction:column;gap:0.4rem;margin-bottom:1rem;}
  label{font-size:0.68rem;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;}
  input{background:#1e1e23;border:1px solid var(--border);color:var(--text);padding:0.55rem 0.75rem;font-family:'Noto Serif JP',serif;font-size:0.82rem;outline:none;transition:border-color 0.15s;width:100%;}
  input:focus{border-color:var(--accent);}
  .btn{width:100%;margin-top:0.5rem;background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent);padding:0.65rem;font-family:'Noto Serif JP',serif;font-size:0.8rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.15s;}
  .btn:hover{background:rgba(201,169,110,0.22);}
  .error{font-size:0.72rem;color:var(--danger);margin-top:0.75rem;text-align:center;display:none;}
</style>
</head>
<body>
<div class="box">
  <div class="title">✦ 管理者ログイン</div>
  <div class="subtitle">編集ページへのアクセス</div>
  <div class="form-group">
    <label>メールアドレス</label>
    <input type="email" id="email" placeholder="example@gmail.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label>パスワード</label>
    <input type="password" id="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <button class="btn" onclick="doLogin()">ログイン</button>
  <div class="error" id="errMsg">メールアドレスまたはパスワードが違います</div>
</div>
<script>
// 認証情報（ハッシュ化して保持）
const ALLOWED_EMAIL = 'cracktrackxxxx@gmail.com';
// パスワードをSHA-256でハッシュ化して比較
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
// etoile216 のSHA-256
const PASS_HASH = 'a0b3e52b487b26ce296364eac9aca2b13668ebc9b3920ceac8de1e634a25c663';

async function doLogin() {
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pass  = document.getElementById('password').value;
  const err   = document.getElementById('errMsg');
  const hash  = await sha256(pass);
  if (email === ALLOWED_EMAIL && hash === PASS_HASH) {
    // セッションに認証済みフラグを保存
    sessionStorage.setItem('admin_auth', btoa(ALLOWED_EMAIL + ':' + hash.slice(0,16)));
    window.location.href = 'admin.html';
  } else {
    err.style.display = 'block';
    document.getElementById('password').value = '';
  }
}
</script>
</body>
</html>
